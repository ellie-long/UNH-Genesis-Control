schema_version: 1

# These describe configured PV candidates, not verified connections.
# Adding a subsystem requires a configuration entry and validation.
sources:
  - subsystem: Cryo
    kind: explicit_archiver
    settings: configs/target_physical/archiver/settings.yaml

  - subsystem: ssRF
    kind: explicit_archiver
    settings: configs/ssrf_physical/archiver/settings.yaml

  - subsystem: Microwave
    kind: ioc_manager
    settings: configs/commissioning/microwave_physical/ioc_manager/settings.yaml

  # The magnet's IPS120-10 supply (magnet_ioc; dev-visualizer, 2026-10-23).
  # Its PVs are the records of configs/magnet_physical/ips120; verified in the
  # simulator against the IPS120 emulator, not yet against the real supply.
  - subsystem: Magnet
    kind: ioc_manager
    settings: configs/magnet_physical/ioc_manager/settings.yaml

  # Verified runtime PVs generated dynamically by the Microwave IOCs.
  # Read-only master recording; no IOC record definitions added.
  - subsystem: Microwave
    kind: pv_list
    pvs:
      - UNH:GEN:MW:SUP:RFActual
      - UNH:GEN:MW:SUP:RFValid
      - UNH:GEN:MW:SUP:RFState
      - UNH:GEN:MW:SUP:ControlOwned
      - UNH:GEN:MW:ROBOT:MOTION_INHIBITED
      - UNH:GEN:MW:ROBOT:JOYSTICK_CONNECTED
      - UNH:GEN:MW:ROBOT:JOYSTICK_ACTIVE
      - UNH:GEN:MW:ROBOT:X_LIMITS
      - UNH:GEN:MW:ROBOT:Y_LIMITS
