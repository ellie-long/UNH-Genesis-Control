# UCA (microwave attenuator) voltage of past cool-downs, from the cool-down logbooks.
#
# Read by cooldown_sim/model/uca_history.py.  Derived facts only (no logbook text).
#
# Procedure: RF is switched ON with the UCA at 5 V (no power); the operator then
# lowers the UCA BY HAND (0 V = full power), often only after alignment or tests,
# and raises it to 5 V before RF OFF.  The record's "UCA (V)" column has not been
# the real UCA since a manual supply took over (see uca_source below), so the
# setting is taken from what operators wrote.
#
# Per cool-down:
#   span        record coverage, lab local time (America/New_York); the lookup is by time
#   uca_source  logbook -- these entries are the UCA history
#               record  -- the record's "UCA (V)" column was the real, DAQ-driven UCA
#                          in this era (its steps match the logbook statements); the
#                          entries below are kept as a cross-check only
#   entries     time-ordered {t, uca_V, basis, note}
#     t       lab local time the entry was written ("YYYY-MM-DD HH:MM"); the action
#             itself is typically 0-4 min earlier
#     basis   stated   -- the logbook gives the setting ("UCA at 0 V", "full power",
#                         "UCA to 5 V")
#             inferred -- implied by context, e.g. "microwaves off" / "back on" while
#                         the record shows RF still on (the safe way to switch them is
#                         the UCA), or "polarizing" right after RF ON
#     note    short neutral description (optional)
#
# The thermal fit uses only 'stated' entries (and record-era UCA steps); 'inferred'
# entries shape the history drive but never select fit steps.  Entries while the
# record shows RF OFF have no effect (the drive is zero) and are listed for
# completeness.  Uncertain readings are listed for review, not resolved here.

