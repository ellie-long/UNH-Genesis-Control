dnp:
  material: irradiated d-butanol
  P_max: 0.498
  tau_up_s: 2450.0
  T1_P_s: 11591.0
  Q_heal_tau_s: 240.0
  T1_Q_apparent_s: 6473.0
  lobe_width_GHz: 0.2
  optimum_offset_GHz: 0.0
  basis:
    P_max, tau_up_s: Spin-1-Rates-Fit results/fit_asym_pq.json steady_state.Pn and legacy_R_T1.tau (Dec
      2025 d-butanol spin-up, B=5.077 T, T=0.997 K)
    T1_P_s: Spin-1-Rates-Fit results/t1_analysis.json T1_P (microwave-off relaxation)
    T1_Q_apparent_s: 'Spin-1-Rates-Fit results/t1_analysis.json T1_Q_apparent -- NOT a model input: it
      is reproduced by Q tracking Q_B(P(t)) as P relaxes (Q ~ P^2 decays at ~T1_P/2); kept as a cross-check'
    Q_heal_tau_s: 'ASSUMED: time for Q to return to the single-temperature curve after it is pushed off
      it (ssRF burns); 4 min, the McClellan test-cooldown generator''s hole-healing default. Short compared
      with tau_up, so TE-start spin-ups stay on the Boltzmann curve (Spin-1-Rates-Fit finding)'
    optimum_offset_GHz: 'best positive P observed at the free-electron frequency 28.025 GHz/T x B within
      the 0.1 GHz binning: 138.4 GHz at 4.94 T (2025-11, 2026-06), 142.3 GHz at 5.08 T (2025-12)'
    lobe_width_GHz: 'ASSUMED: lobe shape not resolvable from the record (operating frequencies were rarely
      varied). Width 0.2 GHz gives the few-percent positive P seen 0.3-0.4 GHz below the optimum; the
      negative lobe is placed on the high-frequency side because none appears below it'
    Q relaxation: ASSUMED single-spin-temperature target Q_B(P) = 2 - sqrt(4 - 3 P^2), approached with
      Q_heal_tau_s (P and Q are separate state variables)
heat:
  mw_W_at_full_drive: 0.062
  W_per_slm: 0.0595
  flow_tau_s: 15.0
  basis:
    mw_W_at_full_drive: 'MEASURED: 2024-12-17 23:33-23:56 logbook (UNH_Poltarg_Cooldown_Notes): UCA toggled
      5 V <-> 0 V gave a ~1 slm Roots-flow differential, 60-62 mW absorbed cold (Farooq: 16.06 SLPM/W).
      Sept 2024 with the old stick was higher. Consistent with the logbook UCA timeline (RF on throughout;
      the toggles match the T1 steps within a minute; each a 0.98 full-drive step at 139.27 GHz). The
      record''s Roots Flow L differential is ~0.85 slm for the first toggle but only 0.2-0.5 slm for the
      later 4-6 min ones (to be reviewed).'
    W_per_slm: 16.8 slpm per W at 1 K (C. Keith, PSTP 2024; Spin-1-Rates-Fit holeburn/dec15_thermal.py)
      = 59.5 mW/slm; first-principles latent heat 62.5 mW/slm
    flow_tau_s: Roots-flow impulse response 10-15 s (Spin-1-Rates-Fit afp_holeburn_technote, Dec-15-2025
      isolated 10-s burns)
assumed:
  cup:
    gain_K_per_W: 2.21
    tau_s: 20.0
    basis: 'PARTLY FITTED: cup thermometers (T1/T2/T3) are much more sensitive to microwaves than the
      helium bath (lab knowledge; the fit agrees). Gain from the FITTED T1 step response (+0.137 K per
      full drive at logbook UCA steps, n=21, IQR +0.045..+0.151) divided by the measured 62 mW. tau =
      median T1 rise time (6 s, n=8) floored at the record''s ~20 s sampling: an upper bound, the response
      is not resolved.'
  bath:
    gain_K_per_W: 2.3
    tau_s: 730.0
    basis: 'ASSUMED: the bath (vapor-pressure thermometer, cell pressure) responds much less than the
      cup. 2.3 K/W came from the earlier RF-flip fit''s median vapor-pressure step (+0.144 K per full
      drive, inconsistent sign, n=13) over 62 mW; the logbook UCA-step fit finds only about +0.003 K per
      full drive (interquartile range spans zero), i.e. ~0.05 K/W. Kept at 2.3 K/W so coldboard test faults
      stay visible: probably an overestimate for microwaves.'
  coldboard:
    to: bath
    basis: 'ASSUMED: coldboard heat goes into the bath (raises bath and, through it, the cup) and into
      boil-off; no record exists. NEGLECTED in normal running: the cold-board supply biases the varactors
      and no heating from it has been noticed (Ells, 2026-10-15), so coldboard_heat_W stays 0 W unless
      a scenario or Sim Control injects heat as a test fault.'
  quench:
    fridge_target_K: 25.0
    magnet_target_K: 15.0
    lattice_target_K: 4.5
    rise_tau_s: 60.0
    recovery_tau_s: 900.0
    T1_quenched_s: 30.0
    cell_target_Torr: 760.0
    shells_target_Torr: 0.001   # IONIVAC (shells' vacuum) during a quench: ASSUMED (question 57)
    basis: ASSUMED quench-like warm-up for exercising interlocks and alarms; not a model of a real quench.
