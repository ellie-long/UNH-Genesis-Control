# cooldown_sim channel map: past-record column -> Genesis instrument channel.
#
# BEST-EFFORT MAPPING FOR REVIEW.  Each entry carries a confidence level and a
# rationale.  Run `python -m cooldown_sim channel-map-report` to regenerate the
# human-readable cross-check table (docs/COOLDOWN_SIM_CHANNEL_MAP.md), and see
# <run>/channel_map_check.html after a real-data run for source-vs-Genesis
# overlays of every mapped channel.
#
# Keys per channel:
#   source:     canonical column name (cooldown_sim/data/aliases.py), or null
#   select:     {by: <text column>, <value>: <column>, ..., default: <column>}
#               picks the source column row-by-row from a text column
#   units:      units of the recorded value
#   wire:       conversion applied before the emulator answers (see
#               cooldown_sim/conversions.py): none | torr_to_mbar |
#               ionivac_count | ls224_ohms
#   valid:      [lo, hi] in recorded units; values outside are treated as
#               garbage -> absent (never clipped into range)
#   absent:     what the emulator does when the record has no value:
#               invalid  -> instrument answers but flags the reading invalid
#               refuse   -> instrument not present (connection refused)
#               output_off -> supply present, output OFF, 0 V / 0 A
#   confidence: high | medium | guess
#   note:       why this mapping was chosen / what to check

instruments:

  ls224_fridge:          # UNH:GEN:CRYO:FRIDGE  (LS224 #1, configs/target_physical/ls224_fridge)
    wire: ls224_ohms     # profile has calibration: -> driver reads SRDG? ohms
    absent: invalid
    channels:
      F1:  {source: F1,  units: K, valid: [0.01, 400], confidence: high, note: "Same F1-F11 names in LabVIEW and Genesis; F-sensor slots from calibration/fridge_thermometry.csv"}
      F2:  {source: F2,  units: K, valid: [0.01, 400], confidence: high}
      F3:  {source: F3,  units: K, valid: [0.01, 400], confidence: high}
      F4:  {source: F4,  units: K, valid: [0.01, 400], confidence: high}
      F5:  {source: F5,  units: K, valid: [0.01, 400], confidence: high}
      F6:  {source: F6,  units: K, valid: [0.01, 400], confidence: high}
      F7:  {source: F7,  units: K, valid: [0.01, 400], confidence: high}
      F8:  {source: F8,  units: K, valid: [0.01, 400], confidence: high}
      F9:  {source: F9,  units: K, valid: [0.01, 400], confidence: high}
      F10: {source: F10, units: K, valid: [0.01, 400], confidence: high}
      F11: {source: F11, units: K, valid: [0.01, 400], confidence: high}

  ls224_magnet:          # UNH:GEN:CRYO:MAG  (LS224 #2)
    wire: ls224_ohms
    absent: invalid
    channels:
      M1: {source: M1, units: K, valid: [0.01, 400], confidence: high, note: "Same M1-M5 names; slots from calibration/magnet_thermometry.csv"}
      M2: {source: M2, units: K, valid: [0.01, 400], confidence: high}
      M3: {source: M3, units: K, valid: [0.01, 400], confidence: high}
      M4: {source: M4, units: K, valid: [0.01, 400], confidence: high}
      M5: {source: M5, units: K, valid: [0.01, 400], confidence: high}

  mks902b:               # UNH:GEN:CRYO:CELL  Cell_PI (Torr)
    wire: none
    absent: invalid
    channels:
      Cell:
        source: manometer_hi
        fallback: manometer           # 2020: the 902B was the only manometer
        units: Torr
        valid: [0.0, 1000.0]
        confidence: high
        note: >-
          Ells (2026-10-15): the MKS 902B (absolute piezo, 0.1-1000 Torr, on
          the target cell) is "Manometer-Hi (Torr)", whatever range the
          LabVIEW display was on, and the 2020 single-range "Manometer (Torr)".
          It struggled with helium near 1 K, so a lower-range manometer
          ("Manometer-Lo", on a KJL-SPARC controller, no Genesis IOC) was
          added from 2021.

  tpg262:                # UNH:GEN:CRYO:VAC  Pump_PI / OVC_PI (mbar)
    wire: torr_to_mbar   # TPG answers in its display unit; emulator reports UNI=0 (mbar)
    absent: invalid
    channels:
      Pump:
        source: roots_pressure
        units: Torr
        valid: [1.0e-5, 1100.0]
        confidence: guess
        note: >-
          TPG262 gauge 1 assumed to be the pumping-line gauge logged as
          "Roots Pressure (Torr)" (0.1-30 Torr while pumping on the fridge).
          CHECK: which LabVIEW pressure column is TPG262 channel 1?
      OVC:
        source: cold_cathode
        units: Torr
        valid: [1.0e-12, 1100.0]
        confidence: guess
        note: >-
          TPG262 gauge 2 assumed to be the OVC cold-cathode gauge logged as
          "ColdCathode.Pres (Torr)" (2021+).  The 2026-06 record has this
          column entirely NaN, so OVC is invalid/absent for that cool-down.
          CHECK: is the OVC gauge now the IONIVAC instead?

  ionivac:               # UNH:GEN:CRYO:ION  Ion_PI (Torr)
    wire: ionivac_count
    absent: refuse       # a silent IONIVAC is how the driver detects "not present"
    channels:
      Ion: {source: ionivac, units: Torr, valid: [1.0e-12, 1100.0], confidence: high, note: "Same instrument name in LabVIEW and Genesis"}

  ls455:                 # UNH:GEN:CRYO:FIELD  Fringe_Field (G) / Fringe_FieldT
    wire: none           # emulator reports UNIT?=1 (gauss)
    absent: refuse
    channels:
      Fringe: {source: fringe_g, units: G, valid: [-1.0e5, 1.0e5], confidence: high, note: "Fringe-field gaussmeter; column present 2021+ (not 2020)"}

  siglent_coldboard:     # UNH:GEN:CRYO:COLDBOARD  (read-only in the live profile)
    wire: none
    absent: output_off
    channels:
      Coldboard:
        source: null
        units: V
        confidence: guess
        note: >-
          No coldboard supply column exists in any past record ("PS Current"
          is the magnet power supply).  The emulated supply is present with
          output OFF at 0 V / 0 A unless a scenario or Sim Control sets a
          coldboard heat load.  Expect the stale-data watchdog to flag the
          constant reading (known issue).

  mw_spd1305x:           # UNH:GEN:MW:PS  (UCA supply for the microwave source)
    wire: none
    absent: output_off
    channels:
      CH1: {source: uca_v, units: V, valid: [-1.0, 30.0], confidence: medium, note: "\"UCA (V)\" (2021+) / \"UCA Voltage (V)\" (2020); NaN in 2026-06.  RF ON requires 5.0 +/- 0.1 V (microwave_ioc/rf_safety.py)."}

# History inputs used by the target model and the autopilot (not instrument
# emulators).  Same keys as above.
history:
  mw_rf_on:   {source: mw_rf_status, units: bool, valid: [0, 1], confidence: medium, note: "\"MMwaves RF Status\" / 2020 \"RF Status\" (Off -> 0)"}
  mw_freq:    {source: mw_freq_ghz, units: GHz, valid: [100.0, 200.0], confidence: medium, note: "-257.674453 GHz is the DAQ's RF-off sentinel; other out-of-range values are garbage"}
  mw_power:   {source: mw_power_db, units: dB, valid: [-60.0, 30.0], confidence: medium, note: "\"MMwaves Power (dB)\"; occasional 1e8 garbage values are rejected by valid range.  CHECK: does this equal the Vaunix MW_PWRC setpoint?"}
  hb_freq:    {source: hb_freq_mhz, units: MHz, valid: [1.0, 300.0], confidence: medium, note: "ssRF / holeburning SMC100A carrier"}
  hb_power:   {source: hb_power_dbm, units: dBm, valid: [-140.0, 30.0], confidence: medium, note: "2020 logged mV (not aliased)"}
  field:      {source: central_field, units: T, valid: [0.0, 6.0], confidence: high}
  magnet_i:   {source: magnet_current, units: A, valid: [0.0, 120.0], confidence: high}
  online_p:   {source: online_p, units: "%", valid: [-110.0, 110.0], confidence: high, note: "LabVIEW live area-method P; values beyond +/-110 % are display glitches"}
  t_cup:      {source: T1, units: K, valid: [0.05, 400], confidence: medium, note: "Target-cup thermometer; no Genesis IOC reads it (CCX placeholder in magnet_thermometry.csv) -- used only as the model's lattice temperature"}
  he_level_fridge: {source: fridge_he_level, units: in, valid: [0.0, 60.0], confidence: high}
  he_level_magnet: {source: magnet_lhe_level, units: in, valid: [0.0, 60.0], confidence: high}

# Every piece of equipment the Genesis control software talks to -- read-only
# monitors as well as the things it drives -- by its Genesis name (the
# ioc_manager key, or a bracketed description for hardware with no IOC of its
# own).  Rendered as the first table of docs/COOLDOWN_SIM_CHANNEL_MAP.md.  A
# unit test checks that every IOC in the canonical ioc_manager files appears
# here or under software_iocs.
#   genesis:   Genesis IOC name          prefix:  EPICS PV prefix
#   equipment: make / model              link:    how Genesis reaches it
#   role:      what it does in the lab   control: what Genesis may do to it
#   map:       channel-map rows / history inputs fed from the past record
#   sim:       what stands in for it in cooldown_sim
#   confidence: high | medium | guess    note:    what to check
equipment:
  # ---------------------------------------------------------------- cryo
  - genesis: ls224_fridge
    equipment: Lake Shore 224 temperature monitor (#1)
    role: Fridge thermometry F1-F11
    link: Ethernet TCP 192.168.1.12:7777
    prefix: UNH:GEN:CRYO:FRIDGE
    control: read-only (monitor)
    map: ls224_fridge.F1-F11
    sim: LS224 emulator
    confidence: high
  - genesis: ls224_magnet
    equipment: Lake Shore 224 temperature monitor (#2)
    role: Magnet thermometry M1-M5
    link: Ethernet TCP 192.168.1.13:7777
    prefix: UNH:GEN:CRYO:MAG
    control: read-only (monitor)
    map: ls224_magnet.M1-M5
    sim: LS224 emulator
    confidence: high
  - genesis: mks902b
    equipment: MKS 902B absolute piezo transducer
    role: Target cell (helium vapour) pressure
    link: RS-232 via serial gateway 192.168.1.251:5004, address 253
    prefix: UNH:GEN:CRYO:CELL
    control: read-only
    map: mks902b.Cell (Manometer-Hi; 2020 Manometer)
    sim: MKS 900-series emulator
    confidence: high
    note: "Ells 2026-10-15: Manometer-Hi, and the 2020 single-range Manometer. Poor near 1 K helium, hence Manometer-Lo from 2021"
  - genesis: tpg262
    equipment: Pfeiffer TPG 262 dual gauge controller
    role: "Gauge 1 'Pump', gauge 2 'OVC'"
    link: RS-232 via serial gateway 192.168.1.251:5011
    prefix: UNH:GEN:CRYO:VAC
    control: read-only
    map: tpg262.Pump, tpg262.OVC
    sim: TPG 262 emulator (ACK/ENQ handshake)
    confidence: guess
    note: "Open questions 2-3: which LabVIEW columns are these two gauges?"
  - genesis: ionivac
    equipment: Leybold IONIVAC combination gauge
    role: Vacuum gauge (streams binary telegrams; never queried)
    link: RS-232 via serial gateway 192.168.1.251:5005
    prefix: UNH:GEN:CRYO:ION
    control: read-only
    map: ionivac.Ion
    sim: IONIVAC emulator
    confidence: high
    note: "CHECK: which volume does it measure (the OVC? see open question 3)"
  - genesis: ls455
    equipment: Lake Shore 455 DSP gaussmeter
    role: Magnet fringe field
    link: RS-232 via serial gateway 192.168.1.251:5007
    prefix: UNH:GEN:CRYO:FIELD
    control: read-only
    map: ls455.Fringe
    sim: LS455 emulator
    confidence: high
  - genesis: siglent_coldboard
    equipment: "Siglent DC supply. Driver written for the single-channel SPD1000X (SPD1168X/SPD1305X); Ells: likely the 4-channel SPD4306X"
    role: "Cold-board supply (Ells: possibly the varactor-diode bias); the safety interlock's only actuator"
    link: Ethernet SCPI 192.168.1.5:5025
    prefix: UNH:GEN:CRYO:COLDBOARD
    control: "read-only in the live profile (write_enabled: false)"
    map: siglent_coldboard.Coldboard (no past-record column)
    sim: SCPI supply emulator (as SPD1168X), output OFF
    confidence: guess
    note: "Open questions 6-7: confirm with caget UNH:GEN:CRYO:COLDBOARD:Coldboard_IDN. Genesis has no SPD4000X driver."
  - genesis: (serial gateway)
    equipment: Serial-to-Ethernet gateway (model not recorded in Genesis)
    role: Carries the four RS-232 instruments
    link: 192.168.1.251, TCP ports 5004 / 5005 / 5007 / 5011
    prefix: "-"
    control: transport only
    map: "-"
    sim: the emulators listen on loopback instead
    confidence: medium
    note: "CHECK: make and model, for the record"
  # ----------------------------------------------------------- microwave
  - genesis: mw_spd1305x
    equipment: "Siglent SPD1305X single-channel DC supply (Ells: the newer 1-channel Siglent)"
    role: UCA control voltage for the VDI chain (5 V = no microwave output, 0 V = full)
    link: Ethernet SCPI 192.168.1.19:5025
    prefix: UNH:GEN:MW:PS
    control: "write-enabled; source ceiling 5 V / 0.1 A; the IOC refuses a supply whose *IDN? is not SPD1305X"
    map: mw_spd1305x.CH1 (UCA V)
    sim: SCPI supply emulator (SPD1305X), 5 V, output ON
    confidence: medium
    note: "Open question 6: confirm the model is an SPD1305X"
  - genesis: mw_vaunix_lms
    equipment: Vaunix LabBrick LMS-123 synthesizer (s/n 15033)
    role: Microwave source, ~11.67 GHz into the x12 multiplier -> ~140 GHz
    link: USB to Raspberry Pi mmWaveRobot.local (tools/vaunix_shim), TCP 1701
    prefix: UNH:GEN:MW:SRC
    control: RF on/off, frequency, power (through the Microwave Supervisor)
    map: history mw_rf_on, mw_freq, mw_power
    sim: the real shim code on a simulated vendor library (LMS-SIM-COOLDOWN)
    confidence: medium
    note: "CHECK: does 'MMwaves Power (dB)' equal the Vaunix power setpoint?"
  - genesis: mw_pcl602
    equipment: PCL602USB stepper-motor controller ('robot', X/Y) with a USB joystick
    role: Positions the microwave stand; move only with the UCA at 5 V
    link: USB to Raspberry Pi mmWaveRobot.local (tools/pcl602_shim), TCP 1702
    prefix: UNH:GEN:MW:ROBOT
    control: motion (left Disabled at startup)
    map: "-"
    sim: microwave_sim robot profile (no motion modelled)
    confidence: high
  - genesis: (mmWaveRobot.local)
    equipment: Raspberry Pi
    role: Hosts the Vaunix and PCL602 shims
    link: LAN, TCP 1701 / 1702
    prefix: "-"
    control: transport only
    map: "-"
    sim: the shims run on loopback
    confidence: high
  - genesis: (not instrumented)
    equipment: VDI amplifier / x12 multiplier / diode chain
    role: Turns the LabBrick output into ~140 GHz
    link: "none: the green light and SIG are NOT in EPICS"
    prefix: "-"
    control: none (the operator confirms by eye)
    map: "-"
    sim: the UCA and RF read-backs drive the target model's microwave heat and DNP
    confidence: high
  # ---------------------------------------------------------------- ssRF
  - genesis: ssrf_smc100a
    equipment: Rohde & Schwarz SMC100A signal generator
    role: ssRF (hole-burning) carrier, FM and power sweep
    link: Ethernet SCPI 192.168.1.16:5025
    prefix: UNH:GEN:SSRF:GEN
    control: write-enabled (RF only through the sequencer and interlock)
    map: history hb_freq, hb_power; blast_log burns
    sim: tools/sim_smc100a.py
    confidence: medium
  - genesis: ssrf_keysight_wavegen
    equipment: Keysight DSOX3024T oscilloscope WaveGen (s/n MY57252012)
    role: External-FM waveform for the SMC100A
    link: USB-VISA on host genesis-keysight (the IOC runs there)
    prefix: UNH:GEN:SSRF:WGEN
    control: write-enabled (waveform staging)
    map: "-"
    sim: tools/sim_keysight_wavegen.py
    confidence: high
  - genesis: ssrf_nmr_switch
    equipment: Mini-Circuits RC-2SPDT-A18 dual SPDT switch
    role: Routes the NMR signal path
    link: HTTP 192.168.1.8:80
    prefix: UNH:GEN:SSRF:NMR_SW
    control: write-enabled
    map: "-"
    sim: tools/sim_minicircuits_switch.py
    confidence: medium
    note: Model from the ssRF commissioning doc
  - genesis: ssrf_rf_switch
    equipment: Mini-Circuits RC-2SPDT-A18 dual SPDT switch
    role: Routes the ssRF signal path
    link: HTTP 192.168.1.11:80
    prefix: UNH:GEN:SSRF:RF_SW
    control: write-enabled
    map: "-"
    sim: tools/sim_minicircuits_switch.py
    confidence: medium
    note: Model from the ssRF commissioning doc
  # ----------------------------------------------------------------- NMR
  - genesis: (online fitter input)
    equipment: NMR DAQ / Q-meter, read out by LabVIEW or PyNMR
    role: Deuteron NMR sweeps for the online fitter
    link: "TCP into the fitter: LabVIEW protocol port 8777 (the PyNMR port in protected mode); results published on 8778"
    prefix: UNH:GEN:SSRF:FIT (the fitter)
    control: "none: Genesis only receives sweeps; TE and baselines are taken at the DAQ"
    map: history online_p (LabVIEW area-method P)
    sim: cooldown_sim NMR source (line computed from the target model)
    confidence: high

# Genesis IOCs with no hardware of their own (logic, supervision, archiving).
software_iocs:
  - {genesis: alarm_summary, prefix: "UNH:GEN:CRYO:ALARM", role: "Cryo alarm roll-up (Alarm_Count, Alarm_Worst)"}
  - {genesis: safety_interlock, prefix: "UNH:GEN:CRYO:SAFE", role: "Cold-board and vacuum permits, trip latch; drives Coldboard_Mode off when enforced"}
  - {genesis: target_status, prefix: "UNH:GEN:CRYO:STATE", role: "Target state machine (Cooldown / Cold / Polarizing ...)"}
  - {genesis: save_restore, prefix: "UNH:GEN:CRYO:SAVE", role: "Setpoint snapshots"}
  - {genesis: archiver, prefix: "UNH:GEN:CRYO:ARCH (cryo); one per subsystem", role: "CSV archive of the monitored PVs"}
  - {genesis: mw_supervisor, prefix: "UNH:GEN:MW:SUP", role: "Supervised microwave RF on/off; UCA permissive"}
  - {genesis: ssrf_interlock, prefix: "UNH:GEN:SSRF:ILK", role: "ssRF connect and RF permits"}
  - {genesis: ssrf_sequencer, prefix: "UNH:GEN:SSRF:SEQ", role: "Burn execution (prepare / arm / start)"}
  - {genesis: burn_recipe, prefix: "UNH:GEN:SSRF:RECIPE", role: "Burn recipes (ssrf_analysis.burn_recipe_ioc)"}
  - {genesis: online fitter, prefix: "UNH:GEN:SSRF:FIT", role: "Deuteron NMR line fitter (online_fitter.epics_run)"}

# Equipment that appears in the LabVIEW data_record but that Genesis has no
# IOC for (yet).  Rendered as "In the past record, not in Genesis".
#   instrument: what it is (make/model where known)
#   columns:    canonical column names (cooldown_sim/data/aliases.py)
#   used_by:    what cooldown_sim does with the column, if anything
record_only:
  - instrument: Low-range cell manometer on a Kurt J. Lesker KJL-SPARC controller
    columns: [manometer_lo]
    used_by: "nothing (the MKS 902B is Manometer-Hi)"
    note: "Ells 2026-10-15: added from 2021 because the 902B struggled with helium near 1 K. CHECK: gauge-head model and range; how LabVIEW reads the KJL-SPARC"
  - instrument: Vapor-pressure readout (LabVIEW)
    columns: [vp_range, vp_temp]
    used_by: "vp_temp is a model-fit channel (fit-params)"
    note: "CHECK: is this computed in LabVIEW from the manometers (range picks Hi or Lo)?"
  - instrument: Target-cup thermometers T1-T3
    columns: [T1, T2, T3]
    used_by: "T1 = the target model's lattice temperature; T1-T3 are model-fit channels"
    note: "CCX placeholders in calibration/magnet_thermometry.csv; no Genesis readout. CHECK: which instrument reads them?"
  - instrument: Roots flow meters (left / right)
    columns: [roots_flow_l, roots_flow_r]
    used_by: "the model's boil-off (59.5 mW/slm) is reported, not replayed"
    note: "Helium pumped out of the fridge"
  - instrument: Separator flow meter
    columns: [separator_flow]
    used_by: nothing
  - instrument: Pirani gauge
    columns: [pirani_v]
    used_by: nothing
    note: "Logged as a voltage"
  - instrument: Helium level meters (fridge, magnet)
    columns: [fridge_he_level, magnet_lhe_level]
    used_by: "history inputs only"
  - instrument: Magnet power supply
    columns: [ps_current, magnet_current, central_field]
    used_by: "central field = the model's B (DNP optimum, NMR line)"
    note: "\"PS Current\" is the magnet supply, not the cold board"
  - instrument: Reliquefier PLC
    columns: []
    used_by: nothing
    note: "Separate data (reliquefierAnalysis/data), not in data_record"
