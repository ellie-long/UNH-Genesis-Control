# cooldown_sim channel map: past-record column -> Genesis instrument channel.
#
# BEST-EFFORT MAPPING FOR REVIEW.  Each entry carries a confidence level and a
# rationale.  Run `python -m cooldown_sim channel-map-report` to regenerate the
# human-readable cross-check table (docs/COOLDOWN_SIM_CHANNEL_MAP.md), and see
# <run>/channel_map_check.html after a real-data run for source-vs-Genesis
# overlays of every mapped channel.
#
# Keys per channel:
#   source:     canonical column name (cooldown_sim/data/aliases.py), or null
#   select:     {by: <text column>, <value>: <column>, ..., default: <column>}
#               picks the source column row-by-row from a text column
#   units:      units of the recorded value
#   wire:       conversion applied before the emulator answers (see
#               cooldown_sim/conversions.py): none | torr_to_mbar |
#               ionivac_count | ls224_ohms | flow_raw (record / the
#               profile's correction) | level_raw ((record - offset) / scale
#               from the profile: AMI 135 cm, AMI 1700 inches)
#   valid:      [lo, hi] in recorded units; values outside are treated as
#               garbage -> absent (never clipped into range)
#   absent:     what the emulator does when the record has no value:
#               invalid  -> instrument answers but flags the reading invalid
#               refuse   -> instrument not present (connection refused)
#               output_off -> supply present, output OFF, 0 V / 0 A
#   confidence: high | medium | guess
#   note:       why this mapping was chosen / what to check

instruments:

  ls224_fridge:          # UNH:GEN:CRYO:FRIDGE  (LS224 #1, configs/target_physical/ls224_fridge)
    wire: ls224_ohms     # profile has calibration: -> driver reads SRDG? ohms
    absent: invalid
    channels:
      F1:  {source: F1,  units: K, valid: [0.01, 400], confidence: high, note: "Same F1-F11 names in LabVIEW and Genesis; F-sensor slots from calibration/fridge_thermometry.csv"}
      F2:  {source: F2,  units: K, valid: [0.01, 400], confidence: high}
      F3:  {source: F3,  units: K, valid: [0.01, 400], confidence: high}
      F4:  {source: F4,  units: K, valid: [0.01, 400], confidence: high}
      F5:  {source: F5,  units: K, valid: [0.01, 400], confidence: high}
      F6:  {source: F6,  units: K, valid: [0.01, 400], confidence: high}
      F7:  {source: F7,  units: K, valid: [0.01, 400], confidence: high}
      F8:  {source: F8,  units: K, valid: [0.01, 400], confidence: high}
      F9:  {source: F9,  units: K, valid: [0.01, 400], confidence: high}
      F10: {source: F10, units: K, valid: [0.01, 400], confidence: high}
      F11: {source: F11, units: K, valid: [0.01, 400], confidence: high}

  ls224_magnet:          # UNH:GEN:CRYO:MAG  (LS224 #2)
    wire: ls224_ohms
    absent: invalid
    channels:
      M1: {source: M1, units: K, valid: [0.01, 400], confidence: high, note: "Same M1-M5 names; slots from calibration/magnet_thermometry.csv"}
      M2: {source: M2, units: K, valid: [0.01, 400], confidence: high}
      M3: {source: M3, units: K, valid: [0.01, 400], confidence: high}
      M4: {source: M4, units: K, valid: [0.01, 400], confidence: high}
      M5: {source: M5, units: K, valid: [0.01, 400], confidence: high}
      T1: {source: T1, units: K, valid: [0.05, 400], confidence: high, note: "Target-cup Cernox on slot C2, stick 2 (Ells, 2026-10-15); CCX curve in calibration/magnet_thermometry.csv.  The record's T1 came from whichever stick was in at the time."}
      T3: {source: T3, units: K, valid: [0.05, 400], confidence: high, note: "Target-cup Cernox on slot C4, stick 2 (Ells, 2026-10-15)"}

  mks902b:               # UNH:GEN:CRYO:CELL  Cell_PI (Torr)
    wire: none
    absent: invalid
    channels:
      Cell:
        source: manometer_hi
        fallback: manometer           # 2020: the 902B was the only manometer
        units: Torr
        valid: [0.0, 1000.0]
        confidence: high
        note: >-
          Ells (2026-10-15): the MKS 902B (absolute piezo on the target cell)
          is "Manometer-Hi (Torr)", whatever range the LabVIEW display was on,
          and the 2020 single-range "Manometer (Torr)".  It reports down to
          0.1 Torr (driver docstring) but is rated only to ~1 Torr (Ells), while
          4He near 1 K is ~0.12 Torr; hence a lower-range manometer
          ("Manometer-Lo", on a KJL-SPARC controller; Genesis IOC
          manometer_low since Utsav's cryo GUI work) from 2021.
          Replayed values below ~1 Torr carry the real gauge's poor accuracy.

  tpg262:                # UNH:GEN:CRYO:VAC  Pump_PI / OVC_PI (mbar)
    wire: torr_to_mbar   # TPG answers in its display unit; emulator reports UNI=0 (mbar)
    absent: invalid
    channels:
      Pump:
        source: roots_pressure
        units: Torr
        valid: [1.0e-5, 1100.0]
        confidence: high
        note: >-
          TPG262 gauge 1 is the TOP manometer on the Roots pump (Ells,
          2026-10-15).  The record's one Roots column, "Roots Pressure (Torr)"
          (0.1-30 Torr while pumping on the fridge), is this gauge: the old
          LabVIEW DAQ only read the top Roots gauge (Ells, 2026-10-16).
      OVC:
        source: null
        units: Torr
        valid: [1.0e-12, 1100.0]
        confidence: high
        note: >-
          TPG262 gauge 2, which Genesis names "OVC", is the BOTTOM manometer
          on the Roots pump, not an insulating vacuum (Ells, 2026-10-15).  The
          old LabVIEW DAQ never logged it, so the replay serves no value for
          it (the gauge reads invalid in the sim); it stays in the live
          datastream for new data (Ells, 2026-10-16).  The shells' insulating
          vacuum is the IONIVAC.

  ionivac:               # UNH:GEN:CRYO:ION  Ion_PI (Torr)
    wire: ionivac_count
    absent: refuse       # a silent IONIVAC is how the driver detects "not present"
    channels:
      Ion: {source: ionivac, fallback: cold_cathode, units: Torr, valid: [1.0e-12, 1100.0], confidence: high, note: "Same instrument name in LabVIEW and Genesis.  Measures the vacuum of the shells separating the fridge space from the magnet space (Ells, 2026-10-15).  Fallback: the cold-cathode gauge, an older back-up on the same vacuum (2021+, NaN from 2025-11; now disconnected).  The model's quench vacuum rise acts here (question 20, 2026-10-16)."}

  ls455:                 # UNH:GEN:CRYO:FIELD  Fringe_Field (G) / Fringe_FieldT
    wire: none           # emulator reports UNIT?=1 (gauss)
    absent: refuse
    channels:
      Fringe: {source: fringe_g, units: G, valid: [-1.0e5, 1.0e5], confidence: high, note: "Fringe-field gaussmeter; column present 2021+ (not 2020)"}

  siglent_coldboard:     # UNH:GEN:CRYO:COLDBOARD  (read-only in the live profile)
    wire: none
    absent: output_off
    channels:
      Coldboard:
        source: null
        units: V
        confidence: high
        note: >-
          No coldboard supply column exists in any past record (Ells,
          2026-10-15: the cold board was on an external DC supply whose
          output was never recorded; "PS Current" is the magnet power
          supply).  In use it is set between 0 and 19 V; it biases the
          cold-board varactors, so it moves the NMR Q-curve's tune (higher
          voltage = higher frequency) and does not noticeably heat.  The
          emulated supply is present with output OFF at 0 V / 0 A unless a
          scenario or Sim Control sets a coldboard heat load (a test fault).
          The sim does not yet move the Q-curve with this voltage.  Expect
          the stale-data watchdog to flag the constant reading (known issue).

  # ------------------------------------------------ optional cryo IOCs
  # Utsav's feature/cryo-gui-completeness IOCs.  absent: refuse = in a
  # cool-down whose record has no value at all for the column, the emulated
  # instrument is not there (connection refused), as for the LS455 in 2020.
  # Within a cool-down a missing value is answered as "no number" (see
  # cooldown_sim/emulators/cryo_optional.py) and the IOC flags it invalid.

  flowmeter_pi:          # UNH:GEN:CRYO:FLOW:RIGHT  RPump_SLM / RPump_Raw (keysight Pi server, TCP 5010)
    wire: flow_raw       # emulator sends record / correction (28/19); the driver multiplies back
    absent: refuse
    channels:
      RPump:
        source: roots_flow_r
        units: slm
        valid: [-500.0, 500.0]
        confidence: medium
        note: >-
          "Roots Flow R (SLM)", 2021-09 on (2020 had a single "Roots Flow"; see
          flowmeter_left).  Utsav's config labels this meter "Backing R", the
          right pump line.  The model adds its heat boil-off to it (share of
          the recorded L+R flow).  ASSUMED the record is corrected SLM (28/19
          applied), so Genesis RPump_SLM = record and RPump_Raw = record x 19/28;
          the logbook's ~1 slm per 60 mW (16.7 slm/W, close to Keith's 16.8)
          supports corrected He SLM.  The record has unphysical excursions
          (-84 to +166 slm in 2026-06) that are replayed as recorded.

  flowmeter_left:        # UNH:GEN:CRYO:FLOW:LEFT  LPump_SLM (TXI040 port 6, TCP 5012)
    wire: flow_raw
    absent: refuse
    channels:
      LPump:
        source: roots_flow_l
        units: slm
        valid: [-500.0, 500.0]
        confidence: medium
        note: >-
          "Roots Flow L (SLM)" (2021-09 on), and the 2020 single "Roots Flow
          (SLM)" (alias).  TXI040 port 6 is labelled left_Roots_Pump in the lab
          technote; Utsav's config makes it the left backing-pump flowmeter.
          EMPTY for the whole of 2026-06, so this instrument is refused (absent)
          when replaying 2026-06.  Repeated 105.49 maxima across eras look like
          a saturation value.  Model boil-off share added as for RPump.

  flowmeter_sep:         # UNH:GEN:CRYO:FLOW:SEP  SepFlow_SLM (TXI040 port 7, TCP 5013)
    wire: flow_raw
    absent: refuse
    channels:
      SepFlow:
        source: separator_flow
        units: slm
        valid: [-500.0, 500.0]
        confidence: medium
        note: >-
          "Seperator Flow (SLM)" (sic), every era.  TXI040 port 7 is labelled
          Separator_Pump in the lab technote.  Replayed (the model has no
          separator).  ~50 slm while running in 2026-06, ~0.05 slm in 2020-22:
          check that the column means the same thing in every era.

  lhe_fridge:            # UNH:GEN:CRYO:FRIDGE:LHE  Fridge_LI (AMI 1700, 192.168.1.27:7180)
    wire: level_raw      # (level - offset) / scale from the profile: inches as-is (1.0 / 0.0)
    absent: refuse
    channels:
      Fridge:
        source: fridge_he_level
        units: in
        valid: [-100.0, 100.0]
        confidence: guess
        note: >-
          'Fridge He Level (")' (2024-08 on) and 2022-05 "Fridge He Level"; no
          column in 2020-21, so absent there.  The record is NEGATIVE most of the
          time the fridge runs (2026-06: -9 to -26 in; 2022-05 down to -87, where
          a "Fridge He Level Raw" column is negative too), positive (~5-14 in)
          when it is not pumped.  An AMI 1700 reports a non-negative level, and
          Genesis's profile has scale 1, offset 0, so the record cannot be what
          the 1700 will show: replayed as recorded (negative values on the wire)
          until the LabVIEW zero/offset is known.

  lhe_magnet:            # UNH:GEN:CRYO:MAG:LHE  Magnet_LI (AMI 135, TXI017 port 2, TCP 23)
    wire: level_raw      # cm = inch / 0.393 on the wire, to 0.1 cm
    absent: refuse
    channels:
      Magnet:
        source: magnet_lhe_level
        units: in
        valid: [0.0, 60.0]
        confidence: high
        note: >-
          'Magnet LHe Level (")' (2021-09 on) and the 2020 'Helium Level (")'.
          The 2020 values step by 0.0393 in = 0.1 cm x 0.393, i.e. this AMI 135
          read in cm with the same 0.393 the Genesis profile uses; the emulator
          answers in cm to 0.1 cm.  The magnet LHe meter is on TXI017 port 2,
          TCP 23 (Ells).  Replayed (the model has no magnet dewar).

  manometer_low:         # UNH:GEN:CRYO:VAC:LOW  Mano_PI / Mano_VapT (KJL-SPARC via the keysight Pi, 5030)
    wire: none           # Torr in the stream
    absent: refuse
    channels:
      Mano:
        source: manometer_lo
        units: Torr
        valid: [1.0e-4, 11.0]
        confidence: high
        note: >-
          "Manometer-Lo (Torr)", 2021-09 on (absent in 2020).  KJLC
          XCG-HT-FB-1, 10 Torr full scale, on a KJL-SPARC, USB to the keysight
          Pi (Ells).  The record reads exactly 0 whenever the cell is above
          ~9-10 Torr (Manometer-Hi) and at the vp_temp 0.650 K dropouts, so 0 is
          treated as no reading (the emulator streams a line with no number),
          as are values above 11 Torr (2022-05 has a 256 Torr glitch).  The
          model scales it like Manometer-Hi (cell_pressure); a modelled value
          above 10 Torr full scale is served as no reading.  Between 1 and 9
          Torr the record's Manometer-Lo reads 1.1-1.6x Manometer-Hi.

  mw_spd1305x:           # UNH:GEN:MW:PS  (UCA supply for the microwave source)
    wire: none
    absent: output_off
    channels:
      CH1: {source: uca_v, units: V, valid: [-1.0, 30.0], confidence: guess, note: "\"UCA (V)\" (2021+) / \"UCA Voltage (V)\" (2020); NaN from 2025-11.  NOT the real UCA for years (Ells, 2026-10-15): an attempt to drive the UCA from an analog output had problems, so an external manual DC supply drove it instead and this column stayed in the record without meaning anything.  The SPD1305X took over only in the last few weeks (date of the switch to the manual supply not known).  RF ON requires 5.0 +/- 0.1 V (microwave_ioc/rf_safety.py)."}

# History inputs used by the target model and the autopilot (not instrument
# emulators).  Same keys as above.
history:
  mw_rf_on:   {source: mw_rf_status, units: bool, valid: [0, 1], confidence: medium, note: "\"MMwaves RF Status\" / 2020 \"RF Status\" (Off -> 0)"}
  mw_freq:    {source: mw_freq_ghz, units: GHz, valid: [100.0, 200.0], confidence: medium, note: "-257.674453 GHz is the DAQ's RF-off sentinel; other out-of-range values are garbage"}
  mw_power:   {source: mw_power_db, units: dB, valid: [-60.0, 30.0], confidence: high, note: "\"MMwaves Power (dB)\" is the Vaunix power setpoint (Ells, 2026-10-15): default 10 dBm, rarely changed; the UCA sets the actual microwave power.  Record: +10 in 2020-21 and 2025-11 on, -3 to -5 in 2022 to 2025-07.  Occasional 1e8 garbage values are rejected by valid range."}
  hb_freq:    {source: hb_freq_mhz, units: MHz, valid: [1.0, 300.0], confidence: medium, note: "ssRF / holeburning SMC100A carrier"}
  hb_power:   {source: hb_power_dbm, units: dBm, valid: [-140.0, 30.0], confidence: medium, note: "2020 logged mV (not aliased)"}
  field:      {source: central_field, units: T, valid: [0.0, 6.0], confidence: high}
  magnet_i:   {source: magnet_current, units: A, valid: [0.0, 120.0], confidence: high}
  online_p:   {source: online_p, units: "%", valid: [-110.0, 110.0], confidence: high, note: "LabVIEW live area-method P; values beyond +/-110 % are display glitches"}
  t_cup:      {source: T1, units: K, valid: [0.05, 400], confidence: medium, note: "Target-cup thermometer T1 (magnet LS224 slot C2); the model's lattice temperature"}
  he_level_fridge: {source: fridge_he_level, units: in, valid: [0.0, 60.0], confidence: high}
  he_level_magnet: {source: magnet_lhe_level, units: in, valid: [0.0, 60.0], confidence: high}

# Every piece of equipment the Genesis control software talks to -- read-only
# monitors as well as the things it drives -- by its Genesis name (the
# ioc_manager key, or a bracketed description for hardware with no IOC of its
# own).  Rendered as the first table of docs/COOLDOWN_SIM_CHANNEL_MAP.md.  A
# unit test checks that every IOC in the canonical ioc_manager files appears
# here or under software_iocs.
#   genesis:   Genesis IOC name          prefix:  EPICS PV prefix
#   equipment: make / model              link:    how Genesis reaches it
#   role:      what it does in the lab   control: what Genesis may do to it
#   map:       channel-map rows / history inputs fed from the past record
#   sim:       what stands in for it in cooldown_sim
#   confidence: high | medium | guess    note:    what to check
equipment:
  # ---------------------------------------------------------------- cryo
  - genesis: ls224_fridge
    equipment: Lake Shore 224 temperature monitor (#1)
    role: Fridge thermometry F1-F11
    link: Ethernet TCP 192.168.1.12:7777
    prefix: UNH:GEN:CRYO:FRIDGE
    control: read-only (monitor)
    map: ls224_fridge.F1-F11
    sim: LS224 emulator
    confidence: high
  - genesis: ls224_magnet
    equipment: Lake Shore 224 temperature monitor (#2)
    role: Magnet thermometry M1-M5 and the target-cup thermometers T1, T3
    link: Ethernet TCP 192.168.1.13:7777
    prefix: UNH:GEN:CRYO:MAG
    control: read-only (monitor)
    map: ls224_magnet.M1-M5, ls224_magnet.T1, ls224_magnet.T3
    sim: LS224 emulator
    confidence: high
    note: "Ells 2026-10-16, confirmed: this LS224 (192.168.1.13) carries both the magnet and the target thermometry"
  - genesis: mks902b
    equipment: MKS 902B absolute piezo transducer
    role: Target cell (helium vapour) pressure
    link: RS-232 via serial gateway 192.168.1.251:5004, address 253
    prefix: UNH:GEN:CRYO:CELL
    control: read-only
    map: mks902b.Cell (Manometer-Hi; 2020 Manometer)
    sim: MKS 900-series emulator
    confidence: high
    note: "Ells 2026-10-15: Manometer-Hi, and the 2020 single-range Manometer. Poor near 1 K helium, hence Manometer-Lo from 2021"
  - genesis: tpg262
    equipment: Pfeiffer TPG 262 dual gauge controller
    role: "Two manometers on the Roots pump: gauge 1 'Pump' = top, gauge 2 'OVC' = bottom (Ells 2026-10-15). Genesis's 'OVC' name is a misnomer"
    link: RS-232 via serial gateway 192.168.1.251:5011
    prefix: UNH:GEN:CRYO:VAC
    control: read-only
    map: tpg262.Pump, tpg262.OVC
    sim: TPG 262 emulator (ACK/ENQ handshake); always set to mbar (Ells 2026-10-16)
    confidence: high
    note: "LabVIEW's 'Roots Pressure (Torr)' is gauge 1, the top one; LabVIEW never read the bottom gauge (Ells 2026-10-16). The vacuum interlock watches gauge 2 as if it were the OVC (see Findings)"
  - genesis: ionivac
    equipment: Leybold IONIVAC combination gauge
    role: "Vacuum of the 'shells' separating the fridge space from the magnet space (Ells 2026-10-15); streams binary telegrams, never queried"
    link: RS-232 via serial gateway 192.168.1.251:5006 (TXI040 port 3)
    prefix: UNH:GEN:CRYO:ION
    control: read-only
    map: ionivac.Ion
    sim: IONIVAC emulator
    confidence: high
    note: "Ells 2026-10-16: the lab has TWO IONIVACs. The one on the shells (the important one) is on TXI040 :5006; the other is on the portable pumping station (a cart with roughing and turbo pumps, moved around the lab) on :5005. Genesis connected to :5005, i.e. read the cart, until the dev-sim fix (question 48). Alarm limits: above 1e-4 Torr with the magnet bottom > 300 K, above 1e-5 Torr below 80 K (Genesis has HIGH/HIHI 800/900 Torr; open questions 25, 39)"
  - genesis: ls455
    equipment: Lake Shore 455 DSP gaussmeter
    role: Magnet fringe field
    link: RS-232 via serial gateway 192.168.1.251:5007
    prefix: UNH:GEN:CRYO:FIELD
    control: read-only
    map: ls455.Fringe
    sim: LS455 emulator
    confidence: high
  - genesis: siglent_coldboard
    equipment: "Siglent SPD1305X single-channel DC supply (Ells 2026-10-15; the driver is written for this SPD1000X family)"
    role: "Cold-board varactor bias, 0-19 V; tunes the NMR Q-curve (higher V = higher frequency). Also the safety interlock's only actuator"
    link: Ethernet SCPI 192.168.1.18:5025
    prefix: UNH:GEN:CRYO:COLDBOARD
    control: "read-only in the live profile (write_enabled: false)"
    map: siglent_coldboard.Coldboard (no past-record column)
    sim: SCPI supply emulator (as SPD1305X), output OFF
    confidence: high
    note: "Ells 2026-10-16: now at 192.168.1.18 (the sticker and the old config said 192.168.1.5, before the post-outage static-IP rework). An SPD1305X. Before Genesis the cold board ran from an external DC supply, never recorded."
  - genesis: flowmeter_pi
    equipment: Teledyne Hastings flowmeter (USB CDC on the keysight Pi, served by flowmeter_pi_headless.py)
    role: "Right Roots/backing-pump line helium flow ('Backing R'): the fridge boil-off"
    link: TCP 192.168.1.24:5010 (the Pi's flowmeter server; 'F' + CR -> '<raw>>')
    prefix: UNH:GEN:CRYO:FLOW:RIGHT
    control: read-only (write_enabled false)
    map: flowmeter_pi.RPump (Roots Flow R)
    sim: Hastings flowmeter emulator behind a Pi-style server (ERROR replies when it has no reading)
    confidence: medium
    note: "Utsav's cryo GUI completeness IOC. RPump_SLM = raw x 28/19 (profile correction). CHECK: is the record's Roots Flow R corrected SLM (assumed), and is the right Roots line the one on the Pi"
  - genesis: flowmeter_left
    equipment: Teledyne Hastings flowmeter
    role: "Left Roots/backing-pump line helium flow ('Backing L')"
    link: RS-232 via serial gateway 192.168.1.251:5012 (TXI040 port 6, 19200 8N1)
    prefix: UNH:GEN:CRYO:FLOW:LEFT
    control: read-only (write_enabled false)
    map: flowmeter_left.LPump (Roots Flow L; 2020 Roots Flow)
    sim: Hastings flowmeter emulator (gateway pass-through)
    confidence: medium
    note: "TXI040 port 6 is labelled left_Roots_Pump in the lab technote (Ells); Utsav's config makes it the left-Roots flowmeter. The record's Roots Flow L is empty for all of 2026-06"
  - genesis: flowmeter_sep
    equipment: Teledyne Hastings flowmeter
    role: Separator pumping-line helium flow
    link: RS-232 via serial gateway 192.168.1.251:5013 (TXI040 port 7, 19200 8N1)
    prefix: UNH:GEN:CRYO:FLOW:SEP
    control: read-only (write_enabled false)
    map: flowmeter_sep.SepFlow (Seperator Flow)
    sim: Hastings flowmeter emulator (gateway pass-through)
    confidence: medium
    note: "TXI040 port 7 is labelled Separator_Pump in the lab technote (Ells); Utsav's config makes it the separator flowmeter"
  - genesis: lhe_fridge
    equipment: American Magnetics Model 1700 helium level instrument
    role: Fridge-space liquid-helium level
    link: Ethernet SCPI 192.168.1.27:7180 (AMI's command port)
    prefix: UNH:GEN:CRYO:FRIDGE:LHE
    control: read-only (write_enabled false)
    map: lhe_fridge.Fridge (Fridge He Level)
    sim: AMI 1700 SCPI emulator (MEASure:HE:LEVel?, *IDN?)
    confidence: medium
    note: "Utsav's driver: scale 1.0, offset 0.0 (inches). CHECK: the record's fridge level is negative while the fridge runs, which an AMI 1700 cannot report: what zero/offset did LabVIEW apply?"
  - genesis: lhe_magnet
    equipment: American Magnetics Model 135 helium level monitor (command echo on)
    role: Magnet-dewar liquid-helium level
    link: RS-232 via serial gateway 2 192.168.1.250:23 (TXI017 port 2, 9600 8N1)
    prefix: UNH:GEN:CRYO:MAG:LHE
    control: read-only (write_enabled false)
    map: lhe_magnet.Magnet (Magnet LHe Level; 2020 Helium Level)
    sim: AMI 135 emulator (echoes LEVEL, answers cm to 0.1 cm)
    confidence: high
    note: "Ells: the magnet LHe meter is on TXI017 port 2 (TCP 23). Reports cm; the profile's 0.393 converts to inches, and the 2020 record steps by exactly 0.1 cm x 0.393"
  - genesis: manometer_low
    equipment: "Manometer-Lo: KJLC XCG-HT-FB-1 capacitance manometer (10 Torr full scale) on a Kurt J. Lesker KJL-SPARC controller"
    role: Low-range target-cell (helium vapour) pressure, and its ITS-90 vapour-pressure temperature
    link: "USB from the KJL-SPARC to the keysight Pi (192.168.1.24); tools/pi_gateway.py forwards the stream on TCP 5030"
    prefix: UNH:GEN:CRYO:VAC:LOW
    control: read-only (write_enabled false)
    map: manometer_low.Mano (Manometer-Lo)
