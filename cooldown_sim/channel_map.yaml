# Genesis IOCs with no hardware of their own (logic, supervision, archiving).
software_iocs:
  - {genesis: alarm_summary, prefix: "UNH:GEN:CRYO:ALARM", role: "Cryo alarm roll-up (Alarm_Count, Alarm_Worst)"}
  - {genesis: safety_interlock, prefix: "UNH:GEN:CRYO:SAFE", role: "Cold-board and vacuum permits, trip latch; drives Coldboard_Mode off when enforced"}
  - {genesis: target_status, prefix: "UNH:GEN:CRYO:STATE", role: "Target state machine (Cooldown / Cold / Polarizing ...)"}
  - {genesis: save_restore, prefix: "UNH:GEN:CRYO:SAVE", role: "Setpoint snapshots"}
  - {genesis: archiver, prefix: "UNH:GEN:CRYO:ARCH (cryo); one per subsystem", role: "CSV archive of the monitored PVs"}
  - {genesis: mw_supervisor, prefix: "UNH:GEN:MW:SUP", role: "Supervised microwave RF on/off; UCA permissive"}
  - {genesis: ssrf_interlock, prefix: "UNH:GEN:SSRF:ILK", role: "ssRF connect and RF permits"}
  - {genesis: ssrf_sequencer, prefix: "UNH:GEN:SSRF:SEQ", role: "Burn execution (prepare / arm / start)"}
  - {genesis: burn_recipe, prefix: "UNH:GEN:SSRF:RECIPE", role: "Burn recipes (ssrf_analysis.burn_recipe_ioc)"}
  - {genesis: online fitter, prefix: "UNH:GEN:SSRF:FIT", role: "Deuteron NMR line fitter (online_fitter.epics_run)"}

# Equipment that appears in the LabVIEW data_record but that Genesis has no
# IOC for (yet).  Rendered as "In the past record, not in Genesis".
#   instrument: what it is (make/model where known)
#   columns:    canonical column names (cooldown_sim/data/aliases.py)
#   used_by:    what cooldown_sim does with the column, if anything
record_only:
  - instrument: Vapor-pressure readout (LabVIEW)
    columns: [vp_range, vp_temp]
    used_by: "vp_temp is a model-fit channel (fit-params) and the model's bath temperature (0.650 K dropouts skipped)"
    note: "Computed in LabVIEW from the manometers, 4He ITS-90 vapor pressure. Ells (2026-10-16): crossover from Manometer-Hi to Manometer-Lo at 5 Torr. The record agrees: ranges Lo and Med follow Manometer-Lo, Hi and VHi follow Manometer-Hi (Med/Hi switch where Manometer-Hi = 5 Torr; Med, Hi, VHi match ITS-90 to < 1 mK; Lo, below 1.25 K, is within ~2 mK, a different low-T equation). vp_temp = 0.650 K exactly is a dropout (Manometer-Lo read 0), not a temperature. Lowest genuine reading in the record: 0.053 Torr, ~0.92 K (2026-06)."
  - instrument: Target-cup thermometer T2 (target stick 1 only)
    columns: [T2]
    used_by: "model-fit channel"
    note: "Ells 2026-10-15: stick 2 is in, with T1 (C2) and T3 (C4) only; stick 1 had T2. T1 and T3 are now ls224_magnet channels (dev-sim)"
  - instrument: Microwave power monitor (SIG output of the microwave chain)
    columns: [sig_v]
    used_by: nothing
    note: "Ells 2026-10-15: measures reflected microwave power; LOWER (more negative) voltage = MORE power. Not in EPICS: a dedicated voltage-reading device is on order, so not this week. Calibration to come. Also a candidate check for an unplugged UCA cable (open question 27); in the record it does not obviously track the UCA column, which was not the real UCA for years"
  - instrument: Cold-cathode gauge (older back-up to the IONIVAC on the shells' vacuum)
    columns: [cold_cathode]
    used_by: "still feeds tpg262.OVC until the vacuum rework (wrong: that gauge is the bottom Roots manometer)"
    note: "Ells 2026-10-15: an older gauge backing up the IONIVAC; the device that read it is broken and disconnected, hence the empty column from 2025-11 (logged 2021 to 2025-07). Not TPG262 gauge 2. In the vacuum rework it can serve as a fallback for the shells' vacuum history"
  - instrument: Pirani gauge
    columns: [pirani_v]
    used_by: nothing
    note: "Logged as a voltage"
  - instrument: Magnet power supply
    columns: [ps_current, magnet_current, central_field]
    used_by: "central field = the model's B (DNP optimum, NMR line)"
    note: "Oxford IPS supply; no Genesis IOC. Ells 2026-10-15: HIGHEST priority of the missing instruments (no magnet, no cool-down). \"PS Current\" is the magnet supply, not the cold board"
  - instrument: Lab thermocouples (backing pumps L/R, separator heater)
    columns: [backing_pump_l_temp, backing_pump_r_temp, sep_heater_temp]
    used_by: nothing
    note: "No Genesis IOC. Ells 2026-10-15: low priority (backing pumps should stay below 70 C)"
  - instrument: Microwave sweep / hop settings (LabVIEW)
    columns: [mw_freq_set2, mw_sweep_span, mw_sweep_time]
    used_by: nothing
    note: "LabVIEW could FM-sweep or hop between the main and a second frequency. Not logged whether either was ON; span is always 0 and the time always 1 s with RF on, so probably unused. Genesis has a supervised one-pass stepped software sweep (SUP:Sweep*); the Vaunix IOC exposes hardware repeat/triangle sweep settings but deliberately does not authorize starting one; nothing in Genesis hops. Ells 2026-10-16: Sweep/Hop used only extremely rarely (extremely low priority); the slow sweep (set df in a set time) was very useful and is mid priority -- Genesis's SUP:Sweep* provides it as step-per-dwell."
  - instrument: EPR coil waveform generator (Agilent 33220A)
    columns: [epr_freq, epr_amplitude]
    used_by: nothing
    note: "No Genesis IOC. Ells 2026-10-15: extremely low priority (EPR only, not planned soon)"
  - instrument: Lock-in amplifier (SRS, EPR)
    columns: [lockin_ch1, lockin_ch2]
    used_by: nothing
    note: "No Genesis IOC (other settings columns not listed). Ells 2026-10-15: extremely low priority (EPR only)"
  - instrument: Reliquefier PLC
    columns: []
    used_by: nothing
    note: "Separate data (reliquefierAnalysis/data), not in data_record"
