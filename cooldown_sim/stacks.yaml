# cooldown_sim stack table.
#
# Which canonical Genesis IOCs a simulated cool-down launches, the private
# replay CA/PVA ports each one gets, and what (emulator or existing simulator)
# stands in for its hardware.  Profiles are GENERATED from the canonical
# settings named here -- never copied -- so the replay always runs the live
# configuration except for the allowlisted loopback/port/output-path keys
# (see cooldown_sim/profile.py and tests/cooldown_sim/*profile_drift*).
#
# Replay ports: CA 61xx / PVA 62xx, emulators 16xxx.  All bound to 127.0.0.1.
# None of these numbers appear in any live profile or launch script; the
# guard and a unit test enforce that.

legs:
  cryo:
    manager: configs/target_physical/ioc_manager/settings.yaml
    iocs:
      siglent_coldboard: {ca: 6111, pva: 6211, emulator: {kind: scpi_supply, port: 16025, model: SPD1305X}}
      mks902b:           {ca: 6112, pva: 6212, emulator: {kind: mks902b, port: 16004}}
      tpg262:            {ca: 6113, pva: 6213, emulator: {kind: tpg262, port: 16011}}
      ionivac:           {ca: 6114, pva: 6214, emulator: {kind: ionivac, port: 16005}}
      # the portable pumping-station cart's IONIVAC (TXI040 :5005, Utsav's
      # ccce63e).  Live CA 5129; 6110/6210 because 6111-6129 are taken and
      # 6123 stays free for dev-visualizer's trend-history IOC.
      ionivac_pump:      {ca: 6110, pva: 6210, emulator: {kind: ionivac, port: 16006}}
      ls455:             {ca: 6115, pva: 6215, emulator: {kind: ls455, port: 16007}}
      ls224_fridge:      {ca: 6116, pva: 6216, emulator: {kind: ls224, port: 16012}}
      ls224_magnet:      {ca: 6117, pva: 6217, emulator: {kind: ls224, port: 16013}}
      alarm_summary:     {ca: 6118, pva: 6218}
      safety_interlock:  {ca: 6119, pva: 6219}
      target_status:     {ca: 6120, pva: 6220}
      save_restore:      {ca: 6121, pva: 6221}
      archiver:          {ca: 6122, pva: 6222}
      # Utsav's optional cryo IOCs (feature/cryo-gui-completeness).  6123/6223
      # is left free: the dev-visualizer branch's trend-history IOC uses it.
      flowmeter_pi:      {ca: 6124, pva: 6224, emulator: {kind: flowmeter_pi, port: 16010}}
      flowmeter_left:    {ca: 6125, pva: 6225, emulator: {kind: flowmeter_diewu, port: 16032}}
      flowmeter_sep:     {ca: 6126, pva: 6226, emulator: {kind: flowmeter_diewu, port: 16033}}
      lhe_fridge:        {ca: 6127, pva: 6227, emulator: {kind: ami1700, port: 16180}}
      lhe_magnet:        {ca: 6128, pva: 6228, emulator: {kind: ami135, port: 16023}}
      manometer_low:     {ca: 6129, pva: 6229, emulator: {kind: manometer_low, port: 16031}}

  ssrf:
    manager: configs/commissioning/ssrf_sim_active/ioc_manager/settings.yaml
    iocs:
      ssrf_smc100a:          {ca: 6130, pva: 6230, simulator: {tool: tools/sim_smc100a.py, port: 16028}}
      ssrf_keysight_wavegen: {ca: 6131, pva: 6231, simulator: {tool: tools/sim_keysight_wavegen.py, port: 16027}}
      ssrf_nmr_switch:       {ca: 6132, pva: 6232, simulator: {tool: tools/sim_minicircuits_switch.py, port: 16081}}
      ssrf_rf_switch:        {ca: 6133, pva: 6233, simulator: {tool: tools/sim_minicircuits_switch.py, port: 16082}}
      ssrf_interlock:        {ca: 6134, pva: 6234}
      # logic_devices/ssrf_lifecycle.py imports fcntl and
      # genesis_common/execution_authorization.py imports pwd at module top,
      # so the sequencer cannot start on native Windows.  Reported SKIPPED.
      ssrf_sequencer:        {ca: 6135, pva: 6235, posix_only: true}

  mw:
    # The PHYSICAL Microwave profile: the microwave_sim supervisor fakes every
    # safety readback internally, so it cannot exercise the real RF chain.
    # Here the unchanged physical supervisor, Vaunix IOC and UCA IOC run; the
    # Vaunix IOC talks to the REAL Raspberry-Pi shim code on loopback with a
    # simulated vendor library (cooldown_sim/emulators/vaunix_brick.py), and
    # the UCA supply is the SCPI emulator.
    manager: configs/commissioning/microwave_physical/ioc_manager/settings.yaml
    iocs:
      mw_spd1305x:   {ca: 6140, pva: 6240, emulator: {kind: scpi_supply, port: 16026, model: SPD1305X}}
      mw_vaunix_lms: {ca: 6141, pva: 6241, simulator: {module: cooldown_sim.emulators.vaunix_brick, port: 16030}}
      mw_supervisor: {ca: 6142, pva: 6242}
    borrowed:
      # robot motion is not part of the rehearsal: the robot sim profile
      mw_pcl602:
        manager: configs/commissioning/microwave_sim/ioc_manager/settings.yaml
        ca: 6143
        pva: 6243

  magnet:
    # The IPS120-10 magnet supply (magnet_ioc, dev-visualizer).  Launched with
    # the cryo leg: the trend history and the Panopticon read its PVs, and its
    # permit reads the cryo IOCs.  The emulator starts at the record's magnet
    # current; the IOC stays write_enabled: false, so it only reads.
    manager: configs/magnet_physical/ioc_manager/settings.yaml
    with_leg: cryo
    iocs:
      ips120:            {ca: 6136, pva: 6236, emulator: {kind: ips120, port: 16120}}

  history:
    # Trend history (logic_devices/trend_history.py): a NEW Genesis logic IOC,
    # not in any live IOC manager yet, so its stack entry names its canonical
    # settings folder itself.  Launched with the cryo leg (it back-fills from
    # the cryo archiver's CSVs and trends cryo and fitter PVs).
    with_leg: cryo
    iocs:
      trend_history: {settings_folder: configs/target_physical/trend_history, ioc: trend_history,
                      ca: 6123, pva: 6223}

  nmr:
    # online_fitter.epics_run (not a master_ioc IOC).
    fitter: {ca: 6100, pva: 6200, fit_port: 16777, publish_port: 16778, pynmr_port: 16779}

  sim:
    # cooldown_sim.controller, run through the unchanged master_ioc.py.
    controller: {prefix: "UNH:GEN:SIM", ca: 6150, pva: 6250, control_port: 16150}

# EPICS client-side ports for every replay process.
epics:
  ca_repeater_port: 6198
  pva_broadcast_port: 6299

# Canonical IOC-manager entries deliberately NOT launched, with the reason.
# The drift guard fails if a canonical manager gains an entry that is neither
# launched above nor listed here.
excluded:
  configs/commissioning/microwave_physical/ioc_manager/settings.yaml:
    mw_pcl602: physical robot; the microwave_sim robot is launched instead
    archiver: Microwave CSV archiver; cooldown_sim.probe records all MW PVs
  configs/commissioning/microwave_sim/ioc_manager/settings.yaml:
    mw_vaunix_lms: sim Vaunix; the physical IOC runs against the real shim on a simulated brick
    mw_supervisor: sim supervisor fakes its safety readbacks; the physical supervisor is launched
