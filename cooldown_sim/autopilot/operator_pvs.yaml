# PVs the autopilot may write: the command PVs an operator uses on the
# Phoebus screens.  Anything else is refused by autopilot/ca.py.
#
# Deliberately absent: every device-level setpoint (e.g. Coldboard_VC/_Mode,
# SMC100A RF/level, WaveGen output, switch masks, Vaunix RF) -- those are
# driven only by the supervisors/sequencers the operator commands.

allow:
  # cryo
  - UNH:GEN:CRYO:ARCH:Archive_Enable
  - UNH:GEN:CRYO:SAFE:Safe_Reset
  - UNH:GEN:CRYO:STATE:status
  - UNH:GEN:CRYO:STATE:material
  - UNH:GEN:CRYO:STATE:auto
  - UNH:GEN:CRYO:SAVE:SR_Save
  # NMR fitter
  - UNH:GEN:SSRF:FIT:MODE_CMD
  - UNH:GEN:SSRF:FIT:UPDATE_CONSTANTS_CMD
  # microwave supervisor (operator-level commands)
  - UNH:GEN:MW:SUP:OutputFrequency
  - UNH:GEN:MW:SUP:RFEnable
  - UNH:GEN:MW:SUP:RFAbort
  # Vaunix output power: set by the operator on the Vaunix screen (exact entry,
  # overrides the MW:SRC deny below; RF and frequency stay supervisor-only)
  - UNH:GEN:MW:SRC:MW_PWRC
  # UCA voltage: set by the operator on the UCA screen -- 5 V for RF ON and
  # before RF OFF, lowered for power after a confirmed ON (exact entry,
  # overrides the MW:PS deny below; output on/off and OVP/OCP stay off-limits)
  - UNH:GEN:MW:PS:VSET_CMD
  # ssRF sequencer: the adaptive-burn recipe, waveform staging, PREPARE/ARM/START.
  # Manual RF/FM commands are an operator commissioning path, not burn replay.
  # ABORT/DISARM are excluded: in the current code their safe-off cleanup locks
  # the sequencer (known issue ssrf-safe-off-lockup).
  - UNH:GEN:SSRF:SEQ:CARRIER_MHZ
  - UNH:GEN:SSRF:SEQ:START_LEVEL_DBM
  - UNH:GEN:SSRF:SEQ:TARGET_LEVEL_DBM
  - UNH:GEN:SSRF:SEQ:FM_DEV_KHZ
  - UNH:GEN:SSRF:SEQ:FM_PERIOD_S
  - UNH:GEN:SSRF:SEQ:FM_REPEATS
  - UNH:GEN:SSRF:SEQ:VHIGH_V
  - UNH:GEN:SSRF:SEQ:VLOW_V
  - UNH:GEN:SSRF:SEQ:WAVEFORM_STAGE_REQ
  - UNH:GEN:SSRF:SEQ:PREPARE_CMD
  - UNH:GEN:SSRF:SEQ:ARM_CMD
  - UNH:GEN:SSRF:SEQ:START_CMD

# Explicitly refused even if a pattern above would match (belt and braces).
deny:
  - UNH:GEN:CRYO:COLDBOARD:*
  - UNH:GEN:SSRF:GEN:*
  - UNH:GEN:SSRF:WGEN:*
  - UNH:GEN:SSRF:NMR_SW:*
  - UNH:GEN:SSRF:RF_SW:*
  - UNH:GEN:MW:SRC:*
  - UNH:GEN:MW:PS:*
  - UNH:GEN:MW:ROBOT:*
