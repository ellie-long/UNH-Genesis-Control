description: >-
  Shells (insulating) vacuum loss on the IONIVAC: the pressure rises past Ells's
  alarm limits and recovers; Genesis should alarm (known issue: it alarms only at
  800/900 Torr) and, per Ells, the interlock does NOT act on it (alarm only)
source: synthetic
start: "2000-01-01 02:00"
duration_min: 20
speed: 10
legs: [cryo]
overrides:
  safety_interlock: {limits: limits_replay.yaml}
# Ells (2026-10-16): vacuum-trip is primarily the shells' vacuum (IONIVAC); the
# IONIVAC alarm is enough, the interlock need not act on it (question 3).  The
# synthetic record's magnet is cold, so the limit is 1e-5 Torr; 5e-4 Torr is
# above both of her limits (1e-4 warm, 1e-5 cold).
actions:
  - {at: 3, do: override, instrument: ionivac, channel: Ion, value: 5.0e-4}
  - {at: 9, do: override, instrument: ionivac, channel: Ion, value: null}
expect:
  - {label: "shells vacuum reads the loss", pv: "UNH:GEN:CRYO:ION:Ion_PI", from: 4, to: 9, op: gt, value: 1.0e-4}
  - {label: "shells vacuum loss alarms (>= MINOR)", pv: "UNH:GEN:CRYO:ION:Ion_PI", severity: ge, value: 1, from: 4, to: 9, known: ionivac-alarm-limits}
  - {label: "shells vacuum recovers", pv: "UNH:GEN:CRYO:ION:Ion_PI", from: 12, to: 20, op: lt, value: 1.0e-5, mode: always}
  - {label: "interlock does not act on the shells vacuum (alarm only)", pv: "UNH:GEN:CRYO:SAFE:Safe_Fault", from: 0, to: 20, op: eq, value: 0, mode: always}
  - {label: "coldboard output stays off", pv: "UNH:GEN:CRYO:COLDBOARD:Coldboard_Mode", from: 0, to: 20, op: eq, value: 0, mode: always}
  - {check: "read-only proof", verdict: PASS}
