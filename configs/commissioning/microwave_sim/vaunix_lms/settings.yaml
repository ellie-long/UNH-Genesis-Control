general:
  prefix: UNH:GEN:MW:SRC
  log_dir: logs
  epics_addr_list: None
  delay: 0.5
vaunix_lms:
  module: microwave_ioc.vaunix_lms.toolkit_device
  autostart: false
  ip: 127.0.0.1
  port: 1701
  timeout: 2.0
  delay: 1.0
  multiplier: 12.0
  channels:
  - MW
  shim:
    start_with_ioc: false
    ssh_host: mmWaveRobot.local
    ssh_user: unhpoltarg
    remote_dir: /home/unhpoltarg/vaunix_shim
    startup_timeout: 15
  archive_records:
  - MW_FI
  - MW_OutFI
  - MW_PWRI
  - MW_RF
  - MW_RF_CMD
  - MW_Ref
  - MW_Lock
  - MW_Connected
  - MW_Simulation
  - MW_TestMode
  - MW_SweepStartI
  - MW_SweepEndI
  - MW_SweepStepI
  - MW_SweepTimeI
  - MW_SweepActive
  - MW_RF_RBV
  - MW_RF_VALID
  - MW_RF_READY
  - MW_RF_DONE_TIME
  - MW_RF_TIME
  - MW_RF_STATE
  - MW_CONTROL_OWNED
  - MW_CONTROL_SESSION
  - MW_RF_ERROR
  records:
    MW_FI:
      DESC: Synthesizer frequency readback
      EGU: GHz
      LOPR: 11.1666666667
      HOPR: 12.0
    MW_FC:
      DESC: Synthesizer frequency command
      EGU: GHz
      DRVL: 11.1666666667
      DRVH: 12.0
    MW_OutFI:
      DESC: Microwave output frequency readback
      EGU: GHz
      LOPR: 134.0
      HOPR: 144.0
    MW_PWRI:
      DESC: Source power readback
      EGU: dBm
      LOPR: -40.0
      HOPR: 10.0
    MW_PWRC:
      DESC: Source power command
      EGU: dBm
      DRVL: -40.0
      DRVH: 10.0
    MW_RF:
      DESC: Legacy OFF-only command; not readback
    MW_RF_CMD:
      DESC: Supervised RF command
    MW_RF_RBV:
      DESC: Vendor-derived RF actual state
    MW_RF_VALID:
      DESC: Vendor RF readback validity
    MW_RF_READY:
      DESC: Safe baseline verified for RF control
    MW_RF_STATE:
      DESC: UNKNOWN OFF or ON vendor RF state
    MW_RF_TIME:
      DESC: Last successful vendor RF read time
    MW_RF_DONE_TIME:
      DESC: Last RF command completion time
    MW_CONTROL_OWNED:
      DESC: Exclusive remote control lease owned
    MW_CONTROL_SESSION:
      DESC: Safe control acquisition generation
    MW_RF_ERROR:
      DESC: RF command or confirmation error
    MW_Ref:
      DESC: Reference source selection
    MW_Lock:
      DESC: PLL lock status
    MW_Connected:
      DESC: Vaunix shim communication status
    MW_Simulation:
      DESC: Genesis local simulation state
    MW_TestMode:
      DESC: Vaunix vendor test-mode state
    MW_SweepStartI:
      DESC: Sweep start frequency readback
      EGU: GHz
      LOPR: 11.1666666667
      HOPR: 12.0
    MW_SweepStartC:
      DESC: Sweep start frequency command
      EGU: GHz
      DRVL: 11.1666666667
      DRVH: 12.0
    MW_SweepEndI:
      DESC: Sweep end frequency readback
      EGU: GHz
      LOPR: 11.1666666667
      HOPR: 12.0
    MW_SweepEndC:
      DESC: Sweep end frequency command
      EGU: GHz
      DRVL: 11.1666666667
      DRVH: 12.0
    MW_SweepStepI:
      DESC: Sweep step readback
      EGU: GHz
    MW_SweepStepC:
      DESC: Sweep step command
      EGU: GHz
    MW_SweepTimeI:
      DESC: Sweep dwell time readback
      EGU: ms
    MW_SweepTimeC:
      DESC: Sweep dwell time command
      EGU: ms
    MW_SweepDirection:
      DESC: Sweep direction
    MW_SweepRepeat:
      DESC: Sweep repeat enable
    MW_SweepBidirectional:
      DESC: Bidirectional sweep enable
    MW_SweepExternalTrigger:
      DESC: External-trigger sweep enable
    MW_SweepRun:
      DESC: Hardware sweep run command
    MW_SweepActive:
      DESC: Hardware sweep active state
  simulation: true
  frequency_min_ghz: 11.5
  frequency_max_ghz: 11.8333333333
  power_min_dbm: -40.0
  power_max_dbm: 10.0
  simulation_frequency_ghz: 11.5
  simulation_power_dbm: -40.0
  simulation_sweep_step_ghz: 0.001
  simulation_sweep_time_ms: 1000

  rf_safety:
    # Expert mode window (Elena Long, 2026-10-24): 134-144 GHz / 12, used
    # only while the supervisor reports ExpertMode
    expert_frequency_min_ghz: 11.1666666667
    expert_frequency_max_ghz: 12.0
    required_voltage: 5.0
    tolerance: 0.1
    maximum_readback_age: 4.0
    frequency_min_ghz: 11.5
    frequency_max_ghz: 11.8333333333
    power_min_dbm: -40.0
    power_max_dbm: 10.0
  rf_safety_pvs:
    uca_connected: UNH:GEN:MW:PS:COMM
    uca_voltage: UNH:GEN:MW:PS:VMEAS
    uca_output: UNH:GEN:MW:PS:OUTPUT_RBV
    uca_time: UNH:GEN:MW:PS:MAN:spd1305x_time
    vaunix_connected: UNH:GEN:MW:SRC:MW_Connected
    vaunix_time: UNH:GEN:MW:SRC:MAN:vaunix_lms_time
    simulation: UNH:GEN:MW:SRC:MW_Simulation
    test_mode: UNH:GEN:MW:SRC:MW_TestMode
    frequency: UNH:GEN:MW:SRC:MW_FI
    power: UNH:GEN:MW:SRC:MW_PWRI
    pll: UNH:GEN:MW:SRC:MW_Lock
    rf_actual: UNH:GEN:MW:SRC:MW_RF_RBV
    rf_valid: UNH:GEN:MW:SRC:MW_RF_VALID
    rf_time: UNH:GEN:MW:SRC:MW_RF_TIME
    control_owned: UNH:GEN:MW:SRC:MW_CONTROL_OWNED
    session: UNH:GEN:MW:SRC:MW_CONTROL_SESSION
    supervisor_request: UNH:GEN:MW:SUP:RFEnable
    supervisor_time: UNH:GEN:MW:SUP:MAN:microwave_supervisor_time
    supervisor_expert: UNH:GEN:MW:SUP:ExpertMode
    rf_error: UNH:GEN:MW:SRC:MW_RF_ERROR
    rf_ready: UNH:GEN:MW:SRC:MW_RF_READY
    rf_done_time: UNH:GEN:MW:SRC:MW_RF_DONE_TIME
