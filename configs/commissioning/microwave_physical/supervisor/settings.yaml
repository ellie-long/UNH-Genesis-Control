general:
  prefix: UNH:GEN:MW:SUP
  log_dir: logs
  epics_addr_list: None
  delay: 0.2
microwave_supervisor:
  module: logic_devices.microwave_supervisor.device
  autostart: false
  delay: 0.2
  simulation: false
  record_prefix: ''
  ca_timeout: 2.0
  maximum_sweep_points: 100000
  source_pvs:
    uca_connected: UNH:GEN:MW:PS:COMM
    uca_voltage: UNH:GEN:MW:PS:VMEAS
    vaunix_connected: UNH:GEN:MW:SRC:MW_Connected
    vaunix_rf: UNH:GEN:MW:SRC:MW_RF_CMD
    vaunix_frequency_command: UNH:GEN:MW:SRC:MW_FC
    vaunix_frequency_readback: UNH:GEN:MW:SRC:MW_FI
  frequency:
    multiplier: 12.0
    output_min_ghz: 138.0
    output_max_ghz: 142.0
  interlock:
    required_voltage: 5.0
    tolerance: 0.1
  follow_dopant_pv: UNH:GEN:CRYO:STATE:dopant   # set with the material, Cryo Safety screen
  material_pv: UNH:GEN:CRYO:STATE:material      # Magic constants are per material
  # Magic +/- factors (GHz/T x field) from Ells, 2026-10-16, per dopant and
  # material.  gamma_d_over_2pi is deliberately NOT set yet: the Magic
  # formula divides CentralFrequency by it, and whether CentralFrequency is
  # the NMR centre in MHz (then 6.53566 MHz/T) is an open question, so
  # Magic stays refused until it is answered.
  dopants:
  - name: None
  - name: Irradiated
    magic:
      d-butanol: {plus: 28.0236, minus: 28.0438}
      ND3: {plus: 28.0245, minus: 28.0605}     # ND3 needs a slow sweep for better numbers
  - name: TEMPO
    magic:
      d-butanol: {plus: 28.0527, minus: 28.0919}
  - name: Trityl
    magic:
      d-propanediol: {plus: 28.0316, minus: 28.0468}
  archive_records:
  - SystemConnected
  - UCAConnected
  - VaunixConnected
  - UCAVoltage
  - RFPermissive
  - InterlockMessage
  - LastError
  - OutputFrequencyRBV
  - RFEnable
  - SweepState
  - SweepPoint
  - SweepTotal
  - SweepProgress
  - SweepCurrentFrequency
  - SweepError
  - Simulation
  - RFActual
  - RFValid
  - RFState
  - ControlOwned
  records:
    SystemConnected:
      DESC: Microwave subsystem connectivity
    UCAConnected:
      DESC: UCA power supply connectivity
    VaunixConnected:
      DESC: Vaunix source connectivity
    UCAVoltage:
      DESC: UCA measured voltage
    RFPermissive:
      DESC: Software RF ON permissive
    InterlockMessage:
      DESC: RF permissive explanation
    LastError:
      DESC: Last supervisor error
    OutputFrequency:
      DESC: Microwave output frequency command
    OutputFrequencyRBV:
      DESC: Microwave output frequency readback
    CentralFrequency:
      DESC: Central frequency for Magic calculation
    Dopant:
      DESC: Dopant selection
    MagicPlus:
      DESC: Magic plus frequency action
    MagicMinus:
      DESC: Magic minus frequency action
    RFEnable:
      DESC: Supervisor RF enable request
    SweepStart:
      DESC: Software sweep start frequency
    SweepStop:
      DESC: Software sweep stop frequency
    SweepStep:
      DESC: Software sweep frequency step
    SweepDwell:
      DESC: Software sweep dwell time
    SweepStartCommand:
      DESC: Start software sweep
    SweepStopCommand:
      DESC: Stop software sweep
    SweepCancel:
      DESC: Cancel software sweep
    SweepState:
      DESC: Software sweep state
    SweepPoint:
      DESC: Current software sweep point
    SweepTotal:
      DESC: Total software sweep points
    SweepProgress:
      DESC: Software sweep progress
    SweepCurrentFrequency:
      DESC: Current software sweep frequency
    SweepError:
      DESC: Software sweep error
    Simulation:
      DESC: Supervisor simulation state

  rf_safety:
    required_voltage: 5.0
    tolerance: 0.1
    maximum_readback_age: 4.0
    frequency_min_ghz: 11.5
    frequency_max_ghz: 11.8333333333
    power_min_dbm: -40.0
    power_max_dbm: 10.0
  rf_safety_pvs:
    uca_connected: UNH:GEN:MW:PS:COMM
    uca_voltage: UNH:GEN:MW:PS:VMEAS
    uca_output: UNH:GEN:MW:PS:OUTPUT_RBV
    uca_time: UNH:GEN:MW:PS:MAN:spd1305x_time
    vaunix_connected: UNH:GEN:MW:SRC:MW_Connected
    vaunix_time: UNH:GEN:MW:SRC:MAN:vaunix_lms_time
    simulation: UNH:GEN:MW:SRC:MW_Simulation
    test_mode: UNH:GEN:MW:SRC:MW_TestMode
    frequency: UNH:GEN:MW:SRC:MW_FI
    power: UNH:GEN:MW:SRC:MW_PWRI
    pll: UNH:GEN:MW:SRC:MW_Lock
    rf_actual: UNH:GEN:MW:SRC:MW_RF_RBV
    rf_valid: UNH:GEN:MW:SRC:MW_RF_VALID
    rf_time: UNH:GEN:MW:SRC:MW_RF_TIME
    control_owned: UNH:GEN:MW:SRC:MW_CONTROL_OWNED
    session: UNH:GEN:MW:SRC:MW_CONTROL_SESSION
    rf_error: UNH:GEN:MW:SRC:MW_RF_ERROR
    rf_ready: UNH:GEN:MW:SRC:MW_RF_READY
    rf_done_time: UNH:GEN:MW:SRC:MW_RF_DONE_TIME
