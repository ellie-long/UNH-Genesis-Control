general:
  prefix: UNH:GEN:SSRF:WGEN
  access_security_file: configs/access_security/ssrf_commands.acf
  log_dir: logs
  epics_addr_list: None
  delay: 0.5

keysight_wavegen:
  module: ssrf_ioc.keysight_wavegen
  autostart: false

  # Physical DSO-X 3024T VISA resource verified 2026-09-25.
  #
  # Physical Raspberry Pi commissioning will replace this with the
  # explicit USB VISA resource. The driver itself remains unchanged.
  resource: "USB0::10893::5990::MY57252012::0::INSTR"
  visa_backend: "@py"

  timeout: 2.0
  settle: 0.0
  delay: 1.0

  # Safe commissioning defaults.
  write_enabled: false
  initialize_on_connect: false

  # BaseDevice requires a channels entry. The WaveGen is one physical
  # device and uses flat PV names below UNH:GEN:SSRF:WGEN.
  channels:
    - WGEN

  archive_records:
    - OUTPUT_RBV
    - PERIOD_RBV
    - VHIGH_RBV
    - VLOW_RBV
    - COMM
    - ERROR
    - LAST_EVENT
    - LAST_OK
    - WRITE_ENABLED
    - WAVEFORM_POINTS
    - WAVEFORM_STAGE_ID
    - ARB_POINTS_RBV
    - WAVEFORM_READY
    - WAVEFORM_ID

  records:
    IDN:
      DESC: Keysight WaveGen instrument identity

    OUTPUT_CMD:
      DESC: WaveGen output command
      ASG: GENESIS_SSRF_CMD
    OUTPUT_RBV:
      DESC: WaveGen output state readback

    PERIOD_CMD:
      DESC: FM waveform period command
      ASG: GENESIS_SSRF_CMD
    PERIOD_RBV:
      DESC: FM waveform period readback

    VHIGH_CMD:
      DESC: WaveGen high voltage command
      ASG: GENESIS_SSRF_CMD
    VHIGH_RBV:
      DESC: WaveGen high voltage readback

    VLOW_CMD:
      DESC: WaveGen low voltage command
      ASG: GENESIS_SSRF_CMD
    VLOW_RBV:
      DESC: WaveGen low voltage readback

    COMM:
      DESC: Keysight WaveGen communication state
    ERROR:
      DESC: Current Keysight WaveGen fault

    LAST_EVENT:
      DESC: Most recent WaveGen operational event

    LAST_OK:
      DESC: Last successful WaveGen read timestamp

    WRITE_ENABLED:
      DESC: WaveGen hardware write permission

    WAVEFORM_CMD:
      DESC: Staged normalized FM waveform
      ASG: GENESIS_SSRF_CMD

    WAVEFORM_POINTS:
      DESC: Number of staged waveform points

    WAVEFORM_STAGE_ID:
      DESC: IOC-memory waveform staging counter

    LOAD_CMD:
      DESC: Commit staged waveform to WaveGen
      ASG: GENESIS_SSRF_CMD

    ARB_POINTS_RBV:
      DESC: Instrument-confirmed ARB point count

    WAVEFORM_READY:
      DESC: Verified waveform upload state

    WAVEFORM_ID:
      DESC: Successful waveform upload counter
