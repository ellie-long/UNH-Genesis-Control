general:
  prefix: UNH:GEN:SSRF:RECIPE
  log_dir: logs
  epics_addr_list: "127.0.0.1:5074"
  delay: 0.2

burn_recipe:
  module: ssrf_analysis.burn_recipe_ioc
  autostart: false
  delay: 0.2
  publish_host: 127.0.0.1
  publish_port: 8778
  max_fit_age_s: 60.0
  event_log_dir: archive/events/ssrf
  session_data_root: archive/sessions/ssrf
  objective: Enhancement
  carrier_mhz: 33.0
  start_level_dbm: -120.0
  target_level_dbm: -22.0
  fm_deviation_khz: 10.0
  fm_repeats: 10
  channels:
    - None
  records:
    FITTER_CONNECTED: {DESC: Fitter publisher connection}
    LATEST_FIT_VALID: {DESC: Latest calibrated fit usable}
    MATERIAL: {DESC: Material from latest fitter result}
    FIT_TYPE: {DESC: Latest fitter analysis mode}
    FIT_TS: {DESC: Latest fitter timestamp}
    FIT_AGE_S: {DESC: Age of latest fitter result}
    CURRENT_POLARIZATION: {DESC: Latest fitted vector polarization}
    REFERENCE_POLARIZATION: {DESC: Calibration reference polarization}
    OBJECTIVE_CMD: {DESC: Enhancement Suppression or Zero}
    OBJECTIVE_RBV: {DESC: Selected burn objective}
    CARRIER_MHZ: {DESC: SMC carrier frequency}
    START_LEVEL_DBM: {DESC: SMC minimum sweep power}
    TARGET_LEVEL_DBM: {DESC: SMC target sweep power}
    FM_DEV_KHZ: {DESC: External FM deviation}
    FM_REPEATS: {DESC: FM periods per sweep dwell}
    FM_PERIOD_S: {DESC: Planner waveform period}
    SWEEP_STEP_DB: {DESC: Derived SMC sweep step}
    SWEEP_DWELL_MS: {DESC: Derived SMC dwell}
    WAVEFORM_POINTS: {DESC: Adaptive ARB points}
    VLOW_V: {DESC: Planner WaveGen low voltage}
    VHIGH_V: {DESC: Planner WaveGen high voltage}
    PLAN_VALID: {DESC: Recipe plan generated successfully}
    SESSION_ID: {DESC: Current correlated burn session}
    ARCHIVE_STATUS: {DESC: JSON and session archive status}
    STATE: {DESC: Burn recipe workflow state}
    REASON: {DESC: Burn recipe workflow reason}
    GENERATE_LOAD_CMD: {DESC: Generate stage and prepare source}
