general:
  prefix: UNH:GEN:SSRF:NMR_SW
  access_security_file: configs/access_security/ssrf_commands.acf
  log_dir: logs
  epics_addr_list: None
  delay: 0.5

minicircuits_switch:
  module: ssrf_ioc.minicircuits_switch
  autostart: false

  # Final physical Genesis ssRF deployment endpoint.
  # Physical NMR switch later: 192.168.1.8:80
  ip: 192.168.1.8
  port: 80
  timeout: 2.0

  delay: 1.0

  # Hardware verification behavior from Farooq's BLAST workflow.
  verify_timeout_s: 5.0
  verify_interval_s: 0.01

  # Physical operation gate; initialize_on_connect remains false.
  write_enabled: true
  initialize_on_connect: false

  channels:
    - SWITCH

  archive_records:
    - MASK_RBV
    - STATE_RBV
    - COMM
    - ERROR
    - LAST_EVENT
    - LAST_OK
    - WRITE_ENABLED

  records:
    MODEL:
      DESC: Mini-Circuits switch model
    SERIAL:
      DESC: Mini-Circuits switch serial number

    PORT_CMD:
      DESC: NMR route command
      ASG: GENESIS_SSRF_CMD

    MASK_RBV:
      DESC: NMR switch SWPORT mask

    STATE_RBV:
      DESC: NMR switch confirmed route

    COMM:
      DESC: NMR switch communication state
    ERROR:
      DESC: Current NMR switch fault
    LAST_EVENT:
      DESC: Last NMR switch operational event
    LAST_OK:
      DESC: Last successful NMR switch read
    WRITE_ENABLED:
      DESC: NMR switch write permission
