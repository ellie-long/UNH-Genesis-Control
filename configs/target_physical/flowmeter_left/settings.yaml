# Genesis Cryogenics physical device profile.
# Adapted from Farooq's October 15, 2026 update.
# Physical operation requires Ubuntu acceptance.
# No hardware writes authorized.

general:
  prefix: UNH:GEN:CRYO:FLOW:LEFT
  log_dir: logs
  epics_addr_list: None
  delay: 0.5
flowmeter_left:
  label: Backing L
  module: target_ioc.instruments.flowmeter_diewu
  autostart: false
  ip: 192.168.1.251
  port: 5012
  timeout: 3
  delay: 2
  request: F
  correction: 1.4736842105
  channels:
  - LPump
  records:
    LPump_SLM:
      DESC: Left pump flow, corrected
      EGU: slm
      PREC: 4
    LPump_Raw:
      DESC: Left pump flow, as reported
      EGU: slm
      PREC: 4
    LPump_Status:
      DESC: Left pump flowmeter status
  write_enabled: false
