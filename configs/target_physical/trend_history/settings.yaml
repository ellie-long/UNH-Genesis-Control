# Trend history (logic_devices/trend_history.py): recent history of the
# Panopticon's trended PVs, served as waveform PVs so its plots are filled the
# moment the screen opens; back-filled from the cryo archiver's CSV files at
# start-up.  A NEW Genesis device: it is not in the live IOC manager yet
# (configs/target_physical/ioc_manager/settings.yaml); the simulated cool-down
# launches it (its stack table).  Run by hand:
#   python master_ioc.py -s configs/target_physical/trend_history -i trend_history
general:
  prefix: UNH:GEN:HIST
  log_dir: logs
  # LS224 magnet + fridge, MKS 902B, TPG 262, IONIVAC, flowmeters (5123-5125),
  # LHe levels (5126-5127), Manometer-Lo (5128), the pumping cart's IONIVAC
  # (5129), the magnet supply (5131) and the online fitter
  epics_addr_list: 127.0.0.1:5112 127.0.0.1:5113 127.0.0.1:5114 127.0.0.1:5116 127.0.0.1:5117
    127.0.0.1:5123 127.0.0.1:5124 127.0.0.1:5125 127.0.0.1:5126 127.0.0.1:5127 127.0.0.1:5128
    127.0.0.1:5129 127.0.0.1:5131 127.0.0.1:5100
  delay: 0.5
trend_history:
  module: logic_devices.trend_history
  autostart: false
  delay: 1.0
  channels:
  - None
  # back-fill from the archiver configured here (its archive_path and file naming)
  archiver_settings: configs/target_physical/archiver/settings.yaml
  backfill: true
  # longest an archived value is held over a gap in the archive (s); the
  # archiver writes on a 0.1% change or every 30 s while the value moves
  max_hold: 900
  # defaults for every group: 6 h of history, one sample every 12 s (1800 points)
  window: 21600
  interval: 12
  time_unit: min
  groups:
    MAG:
      sources:
        M1_TI: UNH:GEN:CRYO:MAG:M1_TI
        M2_TI: UNH:GEN:CRYO:MAG:M2_TI
        M3_TI: UNH:GEN:CRYO:MAG:M3_TI
        M4_TI: UNH:GEN:CRYO:MAG:M4_TI
        M5_TI: UNH:GEN:CRYO:MAG:M5_TI
    FRIDGE:
      sources:
        F1_TI: UNH:GEN:CRYO:FRIDGE:F1_TI
        F2_TI: UNH:GEN:CRYO:FRIDGE:F2_TI
        F3_TI: UNH:GEN:CRYO:FRIDGE:F3_TI
        F4_TI: UNH:GEN:CRYO:FRIDGE:F4_TI
        F5_TI: UNH:GEN:CRYO:FRIDGE:F5_TI
        F6_TI: UNH:GEN:CRYO:FRIDGE:F6_TI
        F7_TI: UNH:GEN:CRYO:FRIDGE:F7_TI
        F8_TI: UNH:GEN:CRYO:FRIDGE:F8_TI
        F9_TI: UNH:GEN:CRYO:FRIDGE:F9_TI
        F10_TI: UNH:GEN:CRYO:FRIDGE:F10_TI
        F11_TI: UNH:GEN:CRYO:FRIDGE:F11_TI
        T1_TI: UNH:GEN:CRYO:MAG:T1_TI
        T3_TI: UNH:GEN:CRYO:MAG:T3_TI
    PRESS:
      # zeros / negatives become gaps so the log plot can autoscale (Elena Long)
      positive_only: true
      sources:
        Cell_PI: {pv: UNH:GEN:CRYO:CELL:Cell_PI, egu: Torr}
        Mano_PI: {pv: UNH:GEN:CRYO:VAC:LOW:Mano_PI, egu: Torr}
        # the TPG 262 reads in its display unit (Pump_Unit: mbar, Torr or Pa,
        # one unit for both gauges); the Panopticon shows every pressure in Torr
        Pump_Torr: {pv: UNH:GEN:CRYO:VAC:Pump_PI, unit_pv: UNH:GEN:CRYO:VAC:Pump_Unit, to: Torr,
                    egu: Torr}
        OVC_Torr: {pv: UNH:GEN:CRYO:VAC:OVC_PI, unit_pv: UNH:GEN:CRYO:VAC:Pump_Unit, to: Torr,
                   egu: Torr}
    LEVEL:
      # the DAQ trends the magnet level over 40 min, the fridge level over 6 h
      sources:
        Magnet_LI: {pv: UNH:GEN:CRYO:MAG:LHE:Magnet_LI, egu: in}
        Fridge_LI: {pv: UNH:GEN:CRYO:FRIDGE:LHE:Fridge_LI, egu: in}
    FLOW:
      sources:
        SepFlow_SLM: {pv: UNH:GEN:CRYO:FLOW:SEP:SepFlow_SLM, egu: slm}
        LPump_SLM: {pv: UNH:GEN:CRYO:FLOW:LEFT:LPump_SLM, egu: slm}
        RPump_SLM: {pv: UNH:GEN:CRYO:FLOW:RIGHT:RPump_SLM, egu: slm}
    MAGNET:
      # the IPS120-10 magnet supply (magnet_ioc): its own screen
      # (gui/genesis_magnet.bob); not in the cryo archiver's list, so this
      # group fills from the moment the service starts
      sources:
        FIELD: {pv: UNH:GEN:MAG:FIELD, egu: T}
        CURRENT: {pv: UNH:GEN:MAG:CURRENT, egu: A}
        MAGNET_CURRENT: {pv: UNH:GEN:MAG:MAGNET_CURRENT, egu: A}
        VOLTAGE: {pv: UNH:GEN:MAG:VOLTAGE, egu: V}
    CART:
      # the pumping cart's IONIVAC: its own screen (gui/genesis_pumping_cart.bob),
      # never the Panopticon (Ells 2026-10-22)
      sources:
        Ion_PI: {pv: UNH:GEN:CRYO:ION:PUMP:Ion_PI, egu: Torr}
    SHELLS:
      # two days of insulating vacuum (the DAQ's span), shown in minutes like
      # the other trends (Elena Long, 2026-10-24); 90 s fits 2 days in 2000 points
      window: 172800
      interval: 90
      time_unit: min
      sources:
        Ion_PI: {pv: UNH:GEN:CRYO:ION:Ion_PI, egu: Torr}
    POL:
      # the fitter's PVs are not in the cryo archiver's list: this group fills
      # from the moment the service starts
      sources:
        P_AREA: {pv: UNH:GEN:SSRF:FIT:P_AREA, egu: '%'}
        P_FIT: {pv: UNH:GEN:SSRF:FIT:P_FIT, egu: '%'}
        Q_FIT: {pv: UNH:GEN:SSRF:FIT:Q_FIT, egu: '%'}
        Q_EQ: {pv: UNH:GEN:SSRF:FIT:Q_EQ, egu: '%'}
  records:
    Hist_Status: {DESC: Trend history state}
    Hist_Sources: {DESC: Trended source PVs}
    Hist_Connected: {DESC: Trended source PVs connected}
    Hist_Backfilled: {DESC: Samples back-filled from archive}
