# Genesis Cryogenics physical device profile.
# Adapted from Farooq's October 15, 2026 update.
# Physical operation requires Ubuntu acceptance.
# No hardware writes authorized.

general:
  prefix: UNH:GEN:CRYO:FLOW:RIGHT
  log_dir: logs
  epics_addr_list: None
  delay: 0.5
flowmeter_pi:
  label: Backing R
  module: target_ioc.instruments.flowmeter_pi
  autostart: false
  ip: 192.168.1.24
  port: 5010
  timeout: 3
  delay: 2
  request: F
  correction: 1.4736842105
  channels:
  - RPump
  records:
    RPump_SLM:
      DESC: Right pump flow, corrected
      EGU: slm
      PREC: 4
    RPump_Raw:
      DESC: Right pump flow, as reported
      EGU: slm
      PREC: 4
    RPump_Status:
      DESC: Right pump flowmeter status
  write_enabled: false
