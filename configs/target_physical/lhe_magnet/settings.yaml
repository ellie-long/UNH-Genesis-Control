# Genesis Cryogenics physical device profile.
# Adapted from Farooq's October 15, 2026 update.
# Physical operation requires Ubuntu acceptance.
# No hardware writes authorized.

general:
  prefix: UNH:GEN:CRYO:MAG:LHE
  log_dir: logs
  epics_addr_list: None
  delay: 0.5
lhe_magnet:
  label: Magnet Space LHE Level (")
  module: target_ioc.instruments.ami135
  autostart: false
  ip: 192.168.1.250
  port: 23
  timeout: 5
  delay: 5
  query: LEVEL
  scale: 0.393
  channels:
  - Magnet
  records:
    Magnet_LI:
      DESC: Magnet space LHe level
      EGU: inch
      PREC: 3
    Magnet_Raw:
      DESC: Magnet level, as reported
      EGU: cm
      PREC: 3
    Magnet_Status:
      DESC: Magnet level probe status
  write_enabled: false
