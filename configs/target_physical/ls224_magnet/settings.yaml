# Genesis target/Cryo physical profile.
# Imported from Farooq's UNH DAQ IOC settings and adapted to the
# standalone Genesis architecture.
#
# Physical endpoint/channel/alarm values remain subject to lab
# verification. Hardware writes are disabled by default.

general:
  prefix: UNH:GEN:CRYO:MAG
  log_dir: logs
  epics_addr_list: None
  delay: 0.5
ls224_magnet:
  module: target_ioc.instruments.ls224
  ip: 192.168.1.13
  port: 7777
  timeout: 3
  delay: 2
  calibration: calibration/Thermo_Calibrations.ods
  # Target stick 2 (actual spreadsheet rows 21/22), no PDF/certificate curves.
  # 2-T1 -> C4, 2-T3 -> C2. The ODS is authoritative at IOC startup.
  ccx_calibration: calibration/Thermo_Calibrations.ods
  ccx_sensors:
    T1: 2-T1
    T3: 2-T3
  ccx_required:
  - T1
  - T3
  channels:
  - M1
  - M2
  - M3
  - M4
  - M5
  - T1
  - T3
  slots:
  - D3
  - D1
  - D2
  - D4
  - D5
  - C4
  - C2
  records:
    M1_TI:
      DESC: Magnet M1 temperature (CCS2 sensor)
      EGU: K
      PREC: 4
      HIHI: 8.0
      HIGH: 6.0
      LOW: 0.05
      LOLO: 0.0
    M2_TI:
      DESC: Magnet M2 temperature
      EGU: K
      PREC: 4
      HIHI: 8.0
      HIGH: 6.0
      LOW: 0.05
      LOLO: 0.0
    M3_TI:
      DESC: Magnet M3 temperature
      EGU: K
      PREC: 4
      HIHI: 8.0
      HIGH: 6.0
      LOW: 0.05
      LOLO: 0.0
    M4_TI:
      DESC: Magnet M4 temperature
      EGU: K
      PREC: 4
      HIHI: 8.0
      HIGH: 6.0
      LOW: 0.05
      LOLO: 0.0
    M5_TI:
      DESC: Magnet M5 temperature
      EGU: K
      PREC: 4
      HIHI: 8.0
      HIGH: 6.0
      LOW: 0.05
      LOLO: 0.0
    T1_TI:
      DESC: Target cup T1 (Cernox, stick 2)
      EGU: K
      PREC: 4
      LOW: 0.05
      LOLO: 0.0
    T3_TI:
      DESC: Target cup T3 (Cernox, stick 2)
      EGU: K
      PREC: 4
      LOW: 0.05
      LOLO: 0.0
  write_enabled: false
