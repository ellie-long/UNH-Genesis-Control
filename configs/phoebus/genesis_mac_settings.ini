# Genesis Phase-I Phoebus configuration
# macOS development system.
#
# Phoebus uses PVAccess because the local Genesis SoftIOCs run on
# separate non-standard ports and PVA has been validated reliably
# on this Mac.

org.phoebus.pv/default=pva

org.phoebus.pv.pva/epics_pva_addr_list=127.0.0.1:5075 127.0.0.1:5076 127.0.0.1:5077 127.0.0.1:5078 127.0.0.1:5079 127.0.0.1:5080 127.0.0.1:5081 127.0.0.1:5082 127.0.0.1:5083 127.0.0.1:5084
org.phoebus.pv.pva/epics_pva_auto_addr_list=false
