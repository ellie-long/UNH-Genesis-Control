general:
  prefix: UNH:GEN:SSRF:WGEN
  log_dir: logs
  epics_addr_list: None
  delay: 0.5

keysight_wavegen:
  module: ssrf_ioc.keysight_wavegen
  autostart: false

  # Development/simulator VISA resource.
  #
  # Physical Raspberry Pi commissioning will replace this with the
  # explicit USB VISA resource. The driver itself remains unchanged.
  resource: "TCPIP0::127.0.0.1::5027::SOCKET"
  visa_backend: "@py"

  timeout: 2.0
  settle: 0.0
  delay: 1.0

  # Safe commissioning defaults.
  write_enabled: false
  initialize_on_connect: false

  # BaseDevice requires a channels entry. The WaveGen is one physical
  # device and uses flat PV names below UNH:GEN:SSRF:WGEN.
  channels:
    - WGEN

  archive_records:
    - OUTPUT_RBV
    - PERIOD_RBV
    - VHIGH_RBV
    - VLOW_RBV
    - COMM
    - ERROR
    - LAST_EVENT
    - LAST_OK
    - WRITE_ENABLED

  records:
    IDN:
      DESC: Keysight WaveGen instrument identity

    OUTPUT_CMD:
      DESC: WaveGen output command
    OUTPUT_RBV:
      DESC: WaveGen output state readback

    PERIOD_CMD:
      DESC: FM waveform period command
    PERIOD_RBV:
      DESC: FM waveform period readback

    VHIGH_CMD:
      DESC: WaveGen high voltage command
    VHIGH_RBV:
      DESC: WaveGen high voltage readback

    VLOW_CMD:
      DESC: WaveGen low voltage command
    VLOW_RBV:
      DESC: WaveGen low voltage readback

    COMM:
      DESC: Keysight WaveGen communication state
    ERROR:
      DESC: Current Keysight WaveGen fault

    LAST_EVENT:
      DESC: Most recent WaveGen operational event

    LAST_OK:
      DESC: Last successful WaveGen read timestamp

    WRITE_ENABLED:
      DESC: WaveGen hardware write permission
