general:
  prefix: UNH:GEN
  log_dir: logs

  # Local macOS prototype: each local CA server uses a distinct port.
  # Replace with deployment network configuration on the final DAQ system.
  epics_addr_list: "127.0.0.1:5064 127.0.0.1:5066 127.0.0.1:5067 127.0.0.1:5068 127.0.0.1:5069 127.0.0.1:5070 127.0.0.1:5071 127.0.0.1:5072 127.0.0.1:5073 127.0.0.1:5074 127.0.0.1:5085"

  manager_ca_server_port: 5064
  manager_pva_server_port: 5075

  delay: 0.5

mw_spd1305x:
  autostart: false
  settings_folder: configs/microwave/spd1305x
  ioc: spd1305x
  heartbeat_pv: UNH:GEN:MW:PS:MAN:spd1305x_time

  # Local macOS prototype ports.
  ca_server_port: 5066
  pva_server_port: 5076

